// ---------- SAVINGS ----------
function savMonthKey(){ return `${cur.year}-${cur.monthIdx}`; }
function ensureSavingsGoals(){
  if(!DATA.savingsGoals || !DATA.savingsGoals.length){
    DATA.savingsGoals = [{id:Date.now(), name:"Цель", amount:100000, entries:[], monthlyTargets:{}}];
  }
  DATA.savingsGoals.forEach(g=>{ if(!g.entries) g.entries=[]; if(!g.monthlyTargets) g.monthlyTargets={}; });
  if(cur.savingsGoalIdx==null || cur.savingsGoalIdx>=DATA.savingsGoals.length || cur.savingsGoalIdx<0) cur.savingsGoalIdx=0;
}
function renderSavings(){
  ensureSavingsGoals();
  const goals=DATA.savingsGoals;
  const gi=cur.savingsGoalIdx;
  const g=goals[gi];
  const amount = +g.amount || 0;
  const entries = g.entries || [];
  const collected = entries.reduce((sum,e)=>sum+(+e.amount||0),0);
  const pct = amount? Math.min(100,Math.round(collected/amount*100)):0;
  const remaining = Math.max(0, amount-collected);

  const mPrefix = `${cur.year}-${pad2(cur.monthIdx+1)}`;
  const monthEntries = entries.map((e,i)=>({...e,_i:i}))
    .filter(e=>e.date && e.date.slice(0,7)===mPrefix)
    .sort((a,b)=>(b.date||"").localeCompare(a.date||""));
  const monthSum = monthEntries.reduce((sum,e)=>sum+(+e.amount||0),0);
  const monthTarget = +((g.monthlyTargets||{})[savMonthKey()]) || 0;
  const monthPct = monthTarget? Math.min(100,Math.round(monthSum/monthTarget*100)) : 0;
  const contribDays = monthEntries.filter(e=>(+e.amount||0)>0).length;
  const avgPerDay = contribDays? Math.round(monthSum/contribDays):0;
  const best = monthEntries.reduce((m,e)=> ((+e.amount||0) > (m?(+m.amount||0):-1)) ? e : m, null);
  const shareOfGoal = amount? Math.round(monthSum/amount*100):0;

  const rows = monthEntries.map(e=>`
    <div class="fin-log-row" style="grid-template-columns:120px 100px 1fr 24px;">
      <input type="date" value="${e.date||''}" data-i="${e._i}" data-f="date">
      <input type="number" value="${e.amount||''}" placeholder="Сумма, ₽" data-i="${e._i}" data-f="amount">
      <input value="${escapeHtml(e.comment||'')}" placeholder="Комментарий (необязательно)" data-i="${e._i}" data-f="comment">
      <button class="del" data-delsav="${e._i}">✕</button>
    </div>`).join("");

  const goalPills=goals.map((gl,i)=>{
    const glAmount=+gl.amount||0;
    const glCollected=(gl.entries||[]).reduce((s,e)=>s+(+e.amount||0),0);
    const glPct=glAmount? Math.min(100,Math.round(glCollected/glAmount*100)):0;
    return `<button class="goal-pill ${i===gi?'active':''}" data-goalpick="${i}">
      <span class="n">${gl.icon||'🎯'} ${escapeHtml(gl.name||'Без названия')}</span><span class="p">${glPct}%</span>
    </button>`;
  }).join("");

  let deadlineHtml="";
  if(g.deadline){
    const today=new Date(); today.setHours(0,0,0,0);
    const dl=new Date(g.deadline+"T00:00:00");
    const daysLeft=Math.ceil((dl-today)/86400000);
    if(remaining<=0){
      deadlineHtml=`<div class="s" style="margin-top:6px;color:var(--green);">Цель уже достигнута 🎉</div>`;
    } else if(daysLeft<=0){
      deadlineHtml=`<div class="s" style="margin-top:6px;color:var(--pink);">Срок (${g.deadline.split('-').reverse().join('.')}) уже прошёл, а осталось отложить ${remaining.toLocaleString('ru-RU')} ₽</div>`;
    } else {
      const perDay=Math.ceil(remaining/daysLeft);
      const perWeek=Math.ceil(remaining/daysLeft*7);
      deadlineHtml=`<div class="s" style="margin-top:6px;">Чтобы успеть к ${g.deadline.split('-').reverse().join('.')} (осталось ${daysLeft} дн.): <b style="color:var(--amber2)">${perDay.toLocaleString('ru-RU')} ₽/день</b> или <b style="color:var(--amber2)">${perWeek.toLocaleString('ru-RU')} ₽/неделю</b></div>`;
    }
  }
  let paceHtml="";
  if(remaining<=0){
    if(!g.deadline) paceHtml=`<div class="s" style="margin-top:6px;color:var(--green);">Цель уже достигнута 🎉</div>`;
  } else {
    const forecast=projectSavingsCompletion(entries, remaining);
    if(forecast){
      const dstr=`${MONTHS_RU[forecast.target.getMonth()].toLowerCase()} ${forecast.target.getFullYear()}`;
      paceHtml=`<div class="s" style="margin-top:6px;">При среднем темпе <b style="color:var(--amber2)">${Math.round(forecast.avgMonthly).toLocaleString('ru-RU')} ₽/мес</b> цель будет достигнута к <b style="color:var(--amber2)">${dstr}</b></div>`;
    } else {
      paceHtml=`<div class="s" style="margin-top:6px;color:var(--grey-dim);">Добавь несколько взносов — тогда сможем спрогнозировать дату</div>`;
    }
  }

  return `<div class="card">
    <h2>Мои цели</h2>
    <div class="goal-pills">${goalPills}</div>
    <div class="add-row" style="margin-top:12px;">
      <input placeholder="Название новой цели..." id="newGoalName">
      <button id="addGoalBtn">+ Добавить цель</button>
    </div>
  </div>

  <div class="card">
    <div style="display:flex;gap:8px;align-items:flex-end;justify-content:space-between;">
      <div class="savings-goal" style="flex:1;">
        <div style="max-width:70px;"><label>Иконка</label><input id="sIcon" maxlength="4" value="${g.icon||'🎯'}"></div>
        <div><label>Название цели</label><input id="sName" value="${escapeHtml(g.name||'')}"></div>
        <div><label>Сумма цели, ₽</label><input id="sAmount" type="number" value="${g.amount||''}"></div>
        <div><label>Успеть к дате (необязательно)</label><input id="sDeadline" type="date" value="${g.deadline||''}"></div>
      </div>
      ${goals.length>1?`<button class="del" id="delGoalBtn" title="Удалить эту цель" style="font-size:18px;padding:6px 10px;">✕</button>`:''}
    </div>
    <div class="kpi" style="border-top-color:var(--amber);margin:14px 0;">
      <div class="t">Прогресс общий</div><div class="v">${pct}%</div>
      <div class="s">Отложено ${collected.toLocaleString('ru-RU')} ₽ из ${amount.toLocaleString('ru-RU')} ₽ · осталось ${remaining.toLocaleString('ru-RU')} ₽</div>
      <div class="progress-bar"><div class="fill" style="width:${pct}%;background:var(--amber)"></div></div>
      ${deadlineHtml}
      ${paceHtml}
    </div>
    <canvas id="savChart" style="width:100%;height:150px;display:block;"></canvas>
  </div>

  <div class="card">
    ${renderMonthNav()}
    <h2>Отчёт за ${MONTHS_RU[cur.monthIdx]}</h2>
    <div class="savings-goal">
      <div><label>Цель на этот месяц, ₽ (необязательно)</label><input id="sMonthTarget" type="number" value="${monthTarget||''}"></div>
    </div>

      });

function getMotivation(habitAvg,taskAvg){
  const avg=(habitAvg+taskAvg)/2;
  if(avg>=80) return "🚀 Отличный темп — почти всё выполнено в этом месяце!";
  if(avg>=50) return "💪 Больше половины сделано — держи ритм дальше.";
  if(avg>=20) return "🌱 Старт есть, но месяц ещё не закончен — наверстай в ближайшие дни.";

// The stored data has no time-of-day (habits are day numbers, entries carry only a
// date), so the feed groups by kind in a fixed order rather than inventing clock times.
function nowTime(){ const d=new Date(); return `${pad2(d.getHours())}:${pad2(d.getMinutes())}`; }
function todayStr(){ const d=new Date(); return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`; }
function habitPctAvg(){
  const ids=activeHabitIdx();
  return ids.length? ids.reduce((s,i)=>s+habitPct(i),0)/ids.length : 0;
}
function pickFocus(){
  const ts=todayStr(), now=new Date();
  const todos=(DATA.todos||[]).map((t,i)=>({...t,_i:i})).filter(t=>!t.done);
  const byDate=a=>a.sort((x,y)=>x.dueDate<y.dueDate?-1:1);
  const overdue=byDate(todos.filter(t=>t.dueDate && t.dueDate<ts));
  if(overdue.length) return {kind:"todo", item:overdue[0], why:`Просрочено с ${overdue[0].dueDate.split('-').reverse().join('.')}`};
  const dueToday=todos.filter(t=>t.dueDate===ts);
  if(dueToday.length) return {kind:"todo", item:dueToday[0], why:"Срок сегодня"};
  const habits=DATA.habits.list.map((name,idx)=>({name,idx})).filter(h=>!isHabitArchived(h.idx));
  const risky=habits.filter(h=>habitStreak(h.idx)>0 && !isHabitDoneOn(h.idx,now) && !isHabitFrozenOn(h.idx,now))
    .sort((a,b)=>habitStreak(b.idx)-habitStreak(a.idx));
  if(risky.length) return {kind:"habit", item:risky[0], why:`Серия ${habitStreak(risky[0].idx)} дн. под угрозой`};
  const undone=habits.filter(h=>!isHabitDoneOn(h.idx,now) && !isHabitFrozenOn(h.idx,now));
  if(undone.length) return {kind:"habit", item:undone[0], why:"Ещё не отмечено сегодня"};
  const soon=byDate(todos.filter(t=>t.dueDate));
  if(soon.length) return {kind:"todo", item:soon[0], why:`Срок ${soon[0].dueDate.split('-').reverse().join('.')}`};
  if(todos.length) return {kind:"todo", item:todos[0], why:"Без срока"};
  return null;
}
function buildDayFeed(){
  const ts=todayStr(), now=new Date(), feed=[];
  DATA.habits.list.forEach((name,idx)=>{
    if(isHabitArchived(idx)) return;
    const done=isHabitDoneOn(idx,now), frozen=!done&&isHabitFrozenOn(idx,now);
    const streak=habitStreak(idx);
    if(done) feed.push({mk:"hab",label:"привычка",text:name,note:streak>1?`${streak}-й день подряд`:"",state:"done",time:habitTimeOn(idx,now)});
    else if(frozen) feed.push({mk:"hab",label:"пауза",text:name,note:"заморожено, серия не рвётся",state:"frozen"});
    else feed.push({mk:"hab",label:"привычка",text:name,note:streak>0?`серия ${streak} дн. под угрозой`:"не отмечено",state:"open",habitIdx:idx});
  });
  const accCurr={}; (DATA.finance.accounts||[]).forEach(a=>accCurr[a.id]=a.currency);
  DATA.finance.entries.filter(e=>e.date===ts).forEach(e=>{
    const sym=CURRENCY_SYMBOL[accCurr[e.accountId||defaultAccountId()]||"RUB"]||"";
    feed.push({mk:"mon",label:e.type==="доход"?"доход":"расход",
      text:e.comment||e.category||"без категории",
      amount:`${e.type==="доход"?"+":"−"}${(+e.amount||0).toLocaleString('ru-RU')} ${sym}`,
      pos:e.type==="доход", state:"info", time:e.time||""});
  });
  (DATA.todos||[]).forEach(t=>{
    if(!t.done && t.dueDate===ts) feed.push({mk:"todo",label:"дело",text:t.text,note:"срок сегодня",state:"info"});
  });
  const jr=DATA.journal[ts];
  if(jr && jr.trim()) feed.push({mk:"note",label:"запись",text:"",quote:jr.trim(),state:"info"});
  // timed events first in clock order; everything without a stamp keeps its original grouping below
  const timed=feed.filter(f=>f.time).sort((a,b)=>a.time<b.time?-1:a.time>b.time?1:0);
  const untimed=feed.filter(f=>!f.time);
  return timed.concat(untimed);
}
const NUM_WORDS=["ноль","одно","два","три","четыре","пять","шесть","семь","восемь","девять","десять",
  "одиннадцать","двенадцать","тринадцать","четырнадцать","пятнадцать","шестнадцать","семнадцать","восемнадцать","девятнадцать","двадцать"];
function plural(n, one, few, many){
  const m100=n%100, m10=n%10;
  if(m100>=11 && m100<=14) return many;
  if(m10===1) return one;
  if(m10>=2 && m10<=4) return few;
  return many;
}
// "три дела" reads better than "3 дела" in the headline, but only up to twenty
function numPhrase(n, one, few, many, feminine){
  const w = n<=20 ? NUM_WORDS[n] : String(n);
  const wf = (feminine && n<=20) ? (n===1?"одна":n===2?"две":w) : w;
  return `${wf} ${plural(n,one,few,many)}`;
}
function todayHeadline(openTodos, undoneHabits){
  if(!openTodos && !undoneHabits) return 'На сегодня <em>всё закрыто</em>';

  if(undoneHabits) parts.push(`${numPhrase(undoneHabits,"привычка","привычки","привычек",true)}`);
  const verb = openTodos ? "Осталось" : (undoneHabits===1 ? "Осталась" : "Осталось");
  return `${verb} ${parts.join("<br>и ")}`;
}

function rangeDates(mode){
  const out=[]; const d=new Date(); d.setHours(0,0,0,0);
  if(mode==="week"){
    const start=getWeekStart(d);
    for(let i=0;i<7;i++){ const x=new Date(start); x.setDate(start.getDate()+i); if(x<=d) out.push(x); }
  } else {
    for(let i=1;i<=d.getDate();i++) out.push(new Date(d.getFullYear(),d.getMonth(),i));
  }
  return out;
}
function renderRetro(){
  const mode=cur.retroMode||"week";
  const dates=rangeDates(mode);
  const dstr=x=>`${x.getFullYear()}-${pad2(x.getMonth()+1)}-${pad2(x.getDate())}`;
  const inRange=new Set(dates.map(dstr));

  const rows=activeHabitIdx().map(idx=>{
    const name=DATA.habits.list[idx];
    const done=dates.filter(x=>isHabitDoneOn(idx,x)).length;
    const frozen=dates.filter(x=>!isHabitDoneOn(idx,x)&&isHabitFrozenOn(idx,x)).length;
    const eligible=Math.max(1,dates.length-frozen);
    return {name, done, frozen, eligible, pct:Math.round(done/eligible*100), streak:habitStreak(idx)};
  }).sort((a,b)=>b.pct-a.pct);

  const best=rows.filter(r=>r.pct>=70);
  const weak=rows.filter(r=>r.pct<50);

  const habHtml=rows.length? rows.map(r=>`
    <div class="retro-row">
      <div class="rr-name">${escapeHtml(r.name)}</div>
      <div class="rr-bar"><span style="width:${Math.min(100,r.pct)}%;background:${r.pct>=70?'var(--green)':r.pct>=50?'var(--purple)':'var(--pink)'}"></span></div>
      <div class="rr-num">${r.done}/${r.eligible}</div>
    </div>`).join("") : '<div class="empty">Привычек пока нет</div>';

  const doneTodos=(DATA.todos||[]).filter(t=>t.done).length;
  const openTodos=(DATA.todos||[]).filter(t=>!t.done);
  const overdue=openTodos.filter(t=>t.dueDate && t.dueDate<todayStr()).length;

  const rubIds=rubAccountIds();
  const ent=DATA.finance.entries.filter(e=>rubIds.has(e.accountId||defaultAccountId()) && e.date && inRange.has(e.date));
  const spent=ent.filter(e=>e.type==="расход").reduce((x,e)=>x+(+e.amount||0),0);
  const earned=ent.filter(e=>e.type==="доход").reduce((x,e)=>x+(+e.amount||0),0);
  const byCat={};
  ent.filter(e=>e.type==="расход").forEach(e=>{ const k=e.category||"без категории"; byCat[k]=(byCat[k]||0)+(+e.amount||0); });

        <div class="kpi" style="border-top-color:var(--green)"><div class="t">Выполнено дел</div><div class="v">${doneTodos}</div><div class="s">${openTodos.length} открыто</div></div>
        <div class="kpi" style="border-top-color:var(--pink)"><div class="t">Расход</div><div class="v">${spent.toLocaleString('ru-RU')} ₽</div><div class="s">${mode==='week'?'за неделю':'за месяц'}</div></div>
        <div class="kpi" style="border-top-color:var(--cyan)"><div class="t">Доход</div><div class="v">${earned.toLocaleString('ru-RU')} ₽</div><div class="s">только ₽-счета</div></div>
        <div class="kpi" style="border-top-color:var(--purple)"><div class="t">Записей</div><div class="v">${notes}</div><div class="s">в дневнике</div></div>
      </div>
      ${topCats.length?`<div style="margin-top:12px;">${topCats.map(([n,v])=>`
        <div class="retro-row">
          <div class="rr-name">${escapeHtml(n)}</div>
          <div class="rr-bar"><span style="width:${Math.round(v/maxCat*100)}%;background:var(--amber)"></span></div>
          <div class="rr-num">${v.toLocaleString('ru-RU')} ₽</div>

  const rubEntries=DATA.finance.entries.filter(e=>rubIds.has(e.accountId||defaultAccountId()));
  const inc=rubEntries.filter(e=>e.type==="доход").reduce((s,e)=>s+(+e.amount||0),0);
  const exp=rubEntries.filter(e=>e.type==="расход").reduce((s,e)=>s+(+e.amount||0),0);
  const prefix=`${now.getFullYear()}-${pad2(now.getMonth()+1)}`;

  const nd=daysInMonth(now.getFullYear(),now.getMonth());

  const other=(DATA.finance.accounts||[]).filter(a=>a.currency!=="RUB");

    : `<div class="cell"><div class="k">Накопления</div><div class="v gold">${(()=>{ensureSavingsGoals();

      <div class="sub">${escapeHtml((DATA.savingsGoals[0]||{}).name||"нет цели")}</div></div>`;

  const habSpark=monthlySeries(m=>{
    const n=DATA.habits.list.length; if(!n) return 0;
    const ndx=daysInMonth(now.getFullYear(),m);

      .reduce((x,e)=>x+(+e.amount||0),0);

function drawDashChart(){
  const canvas=document.getElementById("dashChart"); if(!canvas) return;
  const {ctx,W,H}=setupCanvas(canvas);
  const padL=8,padR=8,padT=12,padB=18;
  const chartW=W-padL-padR, chartH=H-padT-padB;
  const n=12; const stepX=chartW/(n-1);
  const drawSeries=(vals,color)=>{
    const pts=vals.map((v,i)=>[padL+i*stepX, padT+chartH-(v/100)*chartH]);
    ctx.beginPath(); ctx.moveTo(pts[0][0],pts[0][1]);
    for(let i=1;i<pts.length;i++) ctx.lineTo(pts[i][0],pts[i][1]);
    ctx.strokeStyle=color; ctx.lineWidth=2.2; ctx.lineJoin="round"; ctx.stroke();
    pts.forEach(p=>{ ctx.beginPath(); ctx.arc(p[0],p[1],2.4,0,7); ctx.fillStyle=color; ctx.fill(); });
  };
  ctx.strokeStyle=cssVar("--border"); ctx.lineWidth=1;
  [0,25,50,75,100].forEach(v=>{
    const y=padT+chartH-(v/100)*chartH;
    ctx.beginPath(); ctx.moveTo(padL,y); ctx.lineTo(W-padR,y); ctx.stroke();
  });
  drawSeries(window.__dashHSeries||[], cssVar("--purple"));
  drawSeries(window.__dashTSeries||[], cssVar("--cyan"));
  ctx.font="9px 'JetBrains Mono',monospace"; ctx.fillStyle=cssVar("--grey"); ctx.textAlign="center";
  MONTHS_SHORT.forEach((l,i)=>ctx.fillText(l, padL+i*stepX, H-4));
}

// ---------- JOURNAL ----------
const MOODS=["😊","😐","😔","😡","😴"];
function renderJournal(){
  const key=journalKey();
  const text=DATA.journal[key]||"";
  const mood=(DATA.journalMood&&DATA.journalMood[key])||"";
  const moodBtns=MOODS.map(m=>`<button class="mood-btn ${mood===m?'active':''}" data-mood="${m}">${m}</button>`).join("");

  const nd=daysInMonth(cur.year,cur.monthIdx);
  let strip="";
  for(let d=1; d<=nd; d++){
    const dk=`${cur.year}-${pad2(cur.monthIdx+1)}-${pad2(d)}`;
    const m=(DATA.journalMood&&DATA.journalMood[dk])||"";
    strip+=`<div class="mood-day ${d===cur.day?'today':''}" title="${d}">${m||'<span class="dim">'+d+'</span>'}</div>`;
  }

  return `<div class="card">
    <h2>Дневник дня</h2>
    <div class="mood-row">${moodBtns}</div>
    <textarea id="journalText" class="journal-textarea" placeholder="Как прошёл день? Что получилось, что нет, о чём подумал...">${escapeHtml(text)}</textarea>
  </div>
  <div class="card">
    <h2>Настроение за ${MONTHS_RU[cur.monthIdx].toLowerCase()}</h2>
    <div class="mood-strip">${strip}</div>
  </div>`;
}
function bindJournal(){
  const ta=document.getElementById("journalText");
  ta.oninput=()=>{ DATA.journal[journalKey()]=ta.value; scheduleSave(); };
  document.querySelectorAll('[data-mood]').forEach(b=>{
    b.onclick=()=>{
      if(!DATA.journalMood) DATA.journalMood={};
      const key=journalKey();
      DATA.journalMood[key]=(DATA.journalMood[key]===b.dataset.mood)? "" : b.dataset.mood;
      scheduleSave(); render();
    };
  });
}

// ---------- REMINDERS ----------
function notifStatusHtml(){
  if(!("Notification" in window)){
    return `<span style="color:var(--grey-dim);">Уведомления браузера недоступны в этой среде — сработавшие напоминания покажутся баннером внутри приложения, пока оно открыто.</span>`;
  }
  if(Notification.permission==="granted") return `<span style="color:var(--green);">Уведомления включены ✓</span>`;
  if(Notification.permission==="denied") return `<span style="color:var(--pink);">Уведомления заблокированы в настройках браузера/сайта.</span>`;
  return `<button class="btn ghost" id="enableNotif" style="padding:6px 13px;font-size:12px;">Включить уведомления</button>`;
}
function renderReminders(){
  const list=DATA.reminders||[];
  const rows=list.map((r,i)=>`
    <div class="plan-item" style="background:var(--card);border-radius:10px;padding:8px 10px;">
      <div class="chk ${r.enabled?'done':''}" data-remtoggle="${i}">${r.enabled?'✓':''}</div>
      <input type="time" value="${r.time||'09:00'}" data-remfield="time" data-i="${i}"
        style="width:92px;background:transparent;border:none;color:var(--white);font-family:'JetBrains Mono',monospace;font-size:13px;">
      <input value="${escapeHtml(r.label||'')}" placeholder="Напоминание..." data-remfield="label" data-i="${i}"
        style="flex:1;background:transparent;border:none;color:var(--white);font-size:13px;">
      <button class="del" data-remdel="${i}">✕</button>
    </div>`).join("");
  return `<div class="card">
    <h2>⏰ Напоминания</h2>
    <div style="font-size:11.5px;margin-bottom:10px;">${notifStatusHtml()}</div>
    <div class="row-wrap" id="remRows">${rows || '<div class="empty">Пока нет напоминаний</div>'}</div>
    <button class="btn ghost" id="addRem" style="margin-top:10px;">+ Добавить напоминание</button>
  </div>`;
}
function bindReminders(){
  document.querySelectorAll('[data-remtoggle]').forEach(el=>{
    el.onclick=()=>{ const i=+el.dataset.remtoggle; DATA.reminders[i].enabled=!DATA.reminders[i].enabled; scheduleSave(); render(); };
  });
  document.querySelectorAll('[data-remfield]').forEach(el=>{
    el.onchange=()=>{ const i=+el.dataset.i, f=el.dataset.remfield; DATA.reminders[i][f]=el.value; scheduleSave(); };
  });
  document.querySelectorAll('[data-remdel]').forEach(b=>{
    b.onclick=()=>{ const n=(DATA.reminders[+b.dataset.remdel]||{}).label||''; deleteWithUndo(`Напоминание «${n}»`, ()=>DATA.reminders.splice(+b.dataset.remdel,1)); };
  });
  const addBtn=document.getElementById("addRem");
  if(addBtn) addBtn.onclick=()=>{
    DATA.reminders.push({id:Date.now(), time:"09:00", label:"", enabled:true});
    scheduleSave(); render();
  };
  const enBtn=document.getElementById("enableNotif");
  if(enBtn) enBtn.onclick=()=>{ Notification.requestPermission().then(()=>render()); };
}

const firedToday = new Set();
function checkReminders(){
  if(!DATA || !DATA.reminders || !DATA.reminders.length) return;
  const now=new Date();
  const curHM=`${pad2(now.getHours())}:${pad2(now.getMinutes())}`;
  const todayStr=`${now.getFullYear()}-${pad2(now.getMonth()+1)}-${pad2(now.getDate())}`;
  DATA.reminders.forEach(r=>{
    if(!r.enabled || r.time!==curHM) return;
    const fireKey=`${r.id}-${todayStr}`;
    if(firedToday.has(fireKey)) return;
    firedToday.add(fireKey);
    fireReminder(r.label||"Напоминание");
  });
}
function fireReminder(text){
  if("Notification" in window && Notification.permission==="granted"){
    try{ new Notification("Личный трекер", {body:text}); }catch(e){}
  }
  showBanner(text);
}
// ---------- UNDO ----------
// Deletions here can wipe months of history (removing a habit drops every tick with
// it), so each one snapshots the affected slice and offers a short window to restore.
let undoState=null, undoTimer=null;
function deleteWithUndo(label, mutate){
  const before=JSON.stringify(DATA);
  mutate();
  undoState={before, label};
  scheduleSave(); render();
  showUndoToast(label);
}
function showUndoToast(label){
  clearTimeout(undoTimer);
  document.querySelectorAll('.undo-toast').forEach(t=>t.remove());
  const t=document.createElement('div');
  t.className='undo-toast';
  t.innerHTML=`<span>${escapeHtml(label)} удалено</span><button type="button">Отменить</button>`;
  document.body.appendChild(t);
  t.querySelector('button').onclick=()=>{
    if(!undoState) return;
    DATA=JSON.parse(undoState.before);
    undoState=null;
    clearTimeout(undoTimer);
    t.remove();
    scheduleSave(); render();
  };
  requestAnimationFrame(()=>t.classList.add('show'));
  undoTimer=setTimeout(()=>{
    t.classList.remove('show');
    setTimeout(()=>t.remove(),350);
    undoState=null;
  }, 7000);
}
function showBanner(text){
  const b=document.createElement("div");
  b.className="rem-banner";
  b.textContent="⏰ "+text;
  document.body.appendChild(b);
  requestAnimationFrame(()=>b.classList.add("show"));
  setTimeout(()=>{ b.classList.remove("show"); setTimeout(()=>b.remove(),400); }, 6000);
}
setInterval(checkReminders, 20000);

function bindBackupUi(){
  const exportBtn=document.getElementById("exportBtn");
  if(exportBtn) exportBtn.onclick=()=>{ exportBackup(false); DATA._lastBackup=Date.now(); scheduleSave(); render(); };
  const importBtn=document.getElementById("importBtn");
  const importFile=document.getElementById("importFile");
  if(importBtn && importFile){
    importBtn.onclick=()=>importFile.click();
    importFile.onchange=()=>{
      if(importFile.files && importFile.files[0]) importBackupFile(importFile.files[0]);
    };
  }
}

// ---------- SWIPE NAVIGATION ----------
function attachSwipe(){
  const el=document.getElementById("app");
  if(!el) return;
  let startX=0, startY=0, tracking=false;
  el.addEventListener('touchstart', e=>{
    if(e.touches.length!==1) return;
    const t=e.target;
    if(t.closest && t.closest('.days-scroll,input,textarea,select,button')) { tracking=false; return; }
    startX=e.touches[0].clientX; startY=e.touches[0].clientY; tracking=true;
  }, {passive:true});
  el.addEventListener('touchend', e=>{
    if(!tracking) return; tracking=false;
    const dx=e.changedTouches[0].clientX-startX;
    const dy=e.changedTouches[0].clientY-startY;
    if(Math.abs(dx)<60 || Math.abs(dx)<Math.abs(dy)*1.5) return;
    const stepMonth=d=>{ if(d>0){ cur.monthIdx++; if(cur.monthIdx>11){cur.monthIdx=0;cur.year++;} }
                         else { cur.monthIdx--; if(cur.monthIdx<0){cur.monthIdx=11;cur.year--;} } };
    const dir = dx<0 ? 1 : -1;
    const v = cur.sub ? cur.sub[cur.tab] : null;
    if(cur.tab==="rhythm"){
      if(v==="year") cur.year += dir;
      else if(v==="habits" && cur.habitView==="week") cur.weekAnchor += dir*7*86400000;
      else stepMonth(dir);
      render();
    } else if(cur.tab==="doing"){
      if(v==="plan"){ stepMonth(dir); render(); }
    } else if(cur.tab==="money"){
      if(v==="savings"){ stepMonth(dir); render(); }
    } else if(cur.tab==="journal"){
      shiftDay(dir); render();
    }
  }, {passive:true});
}

// ---------- BACKUP / EXPORT / IMPORT ----------
function exportBackup(silent){
  try{
    const blob=new Blob([JSON.stringify(DATA,null,2)], {type:"application/json"});
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a");
    const d=new Date();
    a.href=url;
    a.download=`tracker-backup-${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}.json`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 2000);
    if(silent) showBanner("📥 Еженедельный бэкап сохранён");
  }catch(e){ console.error("backup failed", e); }
}
function importBackupFile(file){
  const reader=new FileReader();
  reader.onload=()=>{
    try{
      const parsed=JSON.parse(reader.result);
      DATA=parsed;
      if(!DATA.plan) DATA.plan={};
      if(!DATA.journal) DATA.journal={};
      if(!DATA.reminders) DATA.reminders=[];
      if(!DATA.todos) DATA.todos=[];
      applyAppearance();
      if(!DATA.planCats||!DATA.planCats.length) DATA.planCats=PLAN_CATS.map(([name,color])=>({name,color}));
      if(!DATA.financeCats||!DATA.financeCats.length) DATA.financeCats=FINANCE_CATS_DEFAULT.map((name,i)=>({name,color:CAT_PALETTE[i%CAT_PALETTE.length]}));
      if(!DATA.finance) DATA.finance={entries:[]};
      if(!DATA.finance.recurring) DATA.finance.recurring=[];
      ensureFinanceAccounts();
      if(!DATA.habits.notes) DATA.habits.notes={};
      if(!DATA.habits.types) DATA.habits.types={};
      if(!DATA.habits.counterTargets) DATA.habits.counterTargets={};
      if(!DATA.habits.counts) DATA.habits.counts={};
      if(!DATA.habits.frozen) DATA.habits.frozen={};
      if(!DATA.habits.times) DATA.habits.times={};
      if(!DATA.habits.archived) DATA.habits.archived={};
      ensureSavingsGoals();
      applyRecurring();
      scheduleSave(); render();
      showBanner("✅ Бэкап загружен");
    }catch(e){ showBanner("⚠️ Не удалось прочитать файл бэкапа"); }
  };
  reader.readAsText(file);
}

loadData();
attachSwipe();
</script>
