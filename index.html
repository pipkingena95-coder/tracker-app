<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Личный трекер</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700&family=Archivo:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* ---- THEME SYSTEM ----
     --amber / --amber2 are the ACCENT slots (kept under the old names so every
     existing rule keeps working); they're swapped by [data-look].
     Surfaces + text are swapped by [data-theme], spacing by [data-density]. */
  :root{
    /* surfaces & text — dark (default) */
    --bg:#17140F; --panel:#211B14; --card:#2A2318; --card2:#342B1D;
    --white:#F4EEE2; --grey:#A89A82; --grey-dim:#6E6350;
    --border:#3D3221;
    --shadow:0 10px 30px -12px rgba(0,0,0,.55);
    --shadow-hover:0 14px 34px -14px rgba(0,0,0,.6);
    --texture:rgba(255,255,255,.012);
    /* status palette — dark */
    --pink:#C15C48; --purple:#D9A441; --cyan:#4C8C88; --green:#83A972;
    --ok-bg:#16351f; --ok-fg:#34D399;
    --bad-bg:#3a1c1c; --bad-fg:#FF6B81;
    --info-bg:#0e3a42; --info-fg:#22D3EE;
    --frozen-fg:#7FB3D5; --frozen-border:#3a5a72;
    --warn-bg1:#4a1a10; --warn-bg2:#5a2010; --warn-fg:#FF8A65;
    --on-green:#0d1f08; --on-pink:#2b0e08;
    --streak-bg1:#3a2410; --streak-bg2:#4a2a0c;
    /* accent — amber (default) */
    --amber:#E8703A; --amber2:#F2A65A; --on-accent:#26130a;
    --glow1:rgba(232,112,58,.10); --glow2:rgba(76,140,136,.08);
    /* density — comfortable (default) */
    --card-pad:16px; --card-radius:18px; --card-gap:14px;
    --row-pad:10px 12px; --row-radius:12px; --app-pad:18px 14px 96px;
    --font-display:'Instrument Serif',serif; --font-body:'Inter',system-ui,sans-serif;
    font-family:var(--font-body);
  }

  html[data-theme="light"]{
    --bg:#F6F1E6; --panel:#FDFAF3; --card:#F1EBDD; --card2:#E7E0CE;
    --white:#2B241A; --grey:#6E6350; --grey-dim:#9A8F7C;
    --border:#DFD6C2;
    --shadow:0 8px 22px -14px rgba(80,60,30,.35);
    --shadow-hover:0 12px 28px -14px rgba(80,60,30,.45);
    --texture:rgba(90,70,40,.020);
    --pink:#B3462F; --purple:#B07F1E; --cyan:#2F6E6A; --green:#4F7F3F;
    --ok-bg:#DCEEDB; --ok-fg:#2E7D46;
    --bad-bg:#FAE0DB; --bad-fg:#B23A28;
    --info-bg:#D8EEED; --info-fg:#256B67;
    --frozen-fg:#35708F; --frozen-border:#B7D3E4;
    --warn-bg1:#FBE2D3; --warn-bg2:#F7D3BC; --warn-fg:#A8421A;
    --on-green:#FFFFFF; --on-pink:#FFFFFF;
    --streak-bg1:#FBEAD7; --streak-bg2:#F6DCC0;
  }

  /* ---- LOOKS: two complete presets, each with its own palette + type ---- */
  /* Фокус (макет А) — graphite surfaces, one flat warm signal, serif display */
  html[data-look="focus"]{
    --bg:#101311; --panel:#191E1B; --card:#191E1B; --card2:#222825;
    --white:#E9EEEA; --grey:#7E8B84; --grey-dim:#5E6A64; --border:#2A322D;
    --amber:#F2C14E; --amber2:#F7D179; --on-accent:#241C05;
    --green:#7FB88A; --pink:#D9705C; --purple:#C9A96E; --cyan:#6E9E99;
    --ok-bg:#1B2A20; --ok-fg:#7FB88A;
    --bad-bg:#2C1D1A; --bad-fg:#D9705C;
    --info-bg:#1A2726; --info-fg:#6E9E99;
    --frozen-fg:#7FA6B8; --frozen-border:#33454E;
    --warn-bg1:#2E2412; --warn-bg2:#3A2C14; --warn-fg:#F2C14E;
    --streak-bg1:#242B22; --streak-bg2:#2C3429;
    --on-green:#0E1A11; --on-pink:#2A100B;
    --glow1:rgba(242,193,78,.05); --glow2:rgba(126,139,132,.04);
    --font-display:'Instrument Serif',serif; --font-body:'Inter',system-ui,sans-serif;
    --radius-card:18px; --radius-row:14px; --accent-flat:1;
  }
  html[data-look="focus"][data-theme="light"]{
    --bg:#F4F3EF; --panel:#FBFAF7; --card:#EFEEE9; --card2:#E4E3DC;
    --white:#1B201D; --grey:#5F6B65; --grey-dim:#8D978F; --border:#DCDBD3;
    --amber:#C8931B; --amber2:#E0AE38; --on-accent:#FFFFFF;
    --ok-bg:#E1EDE2; --ok-fg:#3C7A4C; --bad-bg:#F6E1DC; --bad-fg:#A8402C;
    --info-bg:#E0EBEA; --info-fg:#2F6863;
    --warn-bg1:#F7EBD3; --warn-bg2:#F1E0BC; --warn-fg:#8A6512;
    --streak-bg1:#EDEAE0; --streak-bg2:#E4E0D3;
    --frozen-fg:#3A6E85; --frozen-border:#BBD2DC;
    --on-green:#FFFFFF; --on-pink:#FFFFFF;
    --glow1:rgba(200,147,27,.07); --glow2:rgba(95,107,101,.04);
  }
  /* Пульт (макет Б) — near-black, teal signal, everything monospaced and tight */
  html[data-look="console"]{
    --bg:#0B0C0E; --panel:#14161A; --card:#14161A; --card2:#1D222A;
    --white:#D8DDE5; --grey:#69707C; --grey-dim:#565D68; --border:#232830;
    --amber:#4FD1C5; --amber2:#7EE3DA; --on-accent:#04201D;
    --green:#4FD1C5; --pink:#FF6B4A; --purple:#E3B341; --cyan:#5AA9E6;
    --ok-bg:#0F2A28; --ok-fg:#4FD1C5;
    --bad-bg:#2E1611; --bad-fg:#FF6B4A;
    --info-bg:#122430; --info-fg:#5AA9E6;
    --frozen-fg:#5AA9E6; --frozen-border:#25404F;
    --warn-bg1:#2E1611; --warn-bg2:#3A1D16; --warn-fg:#FF6B4A;
    --streak-bg1:#12232A; --streak-bg2:#162C33;
    --on-green:#04201D; --on-pink:#2A0C06;
    --glow1:rgba(79,209,197,.06); --glow2:rgba(227,179,65,.03);
    --font-display:'Archivo',system-ui,sans-serif; --font-body:'Archivo',system-ui,sans-serif;
    --radius-card:8px; --radius-row:7px; --accent-flat:1;
    --card-pad:11px; --card-radius:8px; --card-gap:8px; --row-pad:8px 9px; --row-radius:7px;
  }
  html[data-look="console"][data-theme="light"]{
    --bg:#F2F4F6; --panel:#FFFFFF; --card:#FFFFFF; --card2:#EAEDF1;
    --white:#171B21; --grey:#5C6470; --grey-dim:#8A929C; --border:#DCE0E6;
    --amber:#178F84; --amber2:#3FB3A7; --on-accent:#FFFFFF;
    --green:#178F84; --pink:#C4462A;
    --ok-bg:#DDF0EE; --ok-fg:#136F66; --bad-bg:#FAE2DC; --bad-fg:#B23E23;
    --info-bg:#E1EDF7; --info-fg:#2A6A99;
    --warn-bg1:#FAE2DC; --warn-bg2:#F5D2C8; --warn-fg:#A83A1E;
    --streak-bg1:#E4EFEE; --streak-bg2:#D6E7E5;
    --frozen-fg:#2A6A99; --frozen-border:#BBD5E8;
    --on-green:#FFFFFF; --on-pink:#FFFFFF;
    --glow1:rgba(23,143,132,.06); --glow2:rgba(90,169,230,.04);
  }

  html[data-density="compact"]{
    --card-pad:11px; --card-radius:14px; --card-gap:9px;
    --row-pad:7px 9px; --row-radius:10px; --app-pad:12px 10px 84px;
  }

  *{box-sizing:border-box;}
  html{background:var(--bg);}
  body{margin:0;background:
      radial-gradient(ellipse 900px 500px at 15% -10%, var(--glow1), transparent 60%),
      radial-gradient(ellipse 700px 500px at 100% 0%, var(--glow2), transparent 55%),
      repeating-linear-gradient(0deg, var(--texture) 0px, var(--texture) 1px, transparent 1px, transparent 3px),
      var(--bg);
    color:var(--white);min-height:100vh;-webkit-font-smoothing:antialiased;
    transition:background-color .25s ease,color .25s ease;}
  .app{max-width:1100px;margin:0 auto;padding:var(--app-pad);}
  header{padding:6px 4px 20px;}
  .today-label{font-family:var(--font-display);font-style:italic;color:var(--amber2);font-size:13px;margin:0 0 6px;letter-spacing:.2px;}
  header h1{margin:0 0 4px;font-family:var(--font-display);font-size:28px;font-weight:700;letter-spacing:.2px;
    background:linear-gradient(100deg,var(--amber2),var(--amber) 45%,var(--purple));
    -webkit-background-clip:text;background-clip:text;color:transparent;}
  header p.sub{margin:0;color:var(--grey);font-size:12.5px;letter-spacing:.2px;}

  nav.tabs{display:flex;gap:6px;overflow-x:auto;padding:6px 2px 16px;scrollbar-width:none;}
  nav.tabs::-webkit-scrollbar{display:none;}
  nav.tabs button{flex:0 0 auto;background:var(--panel);border:1px solid var(--border);color:var(--grey);
    padding:9px 15px;border-radius:20px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;
    transition:.18s ease;}
  nav.tabs button.active{background:linear-gradient(100deg,var(--amber),var(--amber2));color:var(--on-accent);
    border-color:transparent;box-shadow:0 4px 16px -4px rgba(232,112,58,.55);}

  .month-nav{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px;
    background:var(--panel);border-radius:14px;padding:8px 10px;border:1px solid var(--border);}
  .month-nav button{background:var(--card);border:1px solid var(--border);color:var(--white);
    width:34px;height:34px;border-radius:10px;font-size:16px;cursor:pointer;transition:.15s;}
  .month-nav button:hover{border-color:var(--amber);color:var(--amber2);}
  .month-nav .label{font-family:var(--font-display);font-weight:600;font-size:16px;flex:1;text-align:center;}

  .card{background:var(--panel);border-radius:var(--card-radius);padding:var(--card-pad);margin-bottom:var(--card-gap);border:1px solid var(--border);
    box-shadow:var(--shadow);transition:.2s ease;}
  .card:hover{transform:translateY(-2px);box-shadow:var(--shadow-hover);}
  .card h2{margin:0 0 12px;font-size:12px;color:var(--grey);text-transform:uppercase;letter-spacing:1px;font-weight:700;}

  /* KPI dashboard */
  .kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:16px;}
  .kpi{border-radius:16px;padding:16px;background:var(--card);border-top:3px solid var(--cyan);position:relative;
    box-shadow:var(--shadow);}
  .kpi .t{font-size:10.5px;color:var(--grey);font-weight:700;text-transform:uppercase;letter-spacing:.6px;margin-bottom:8px;}
  .kpi .v{font-family:var(--font-display);font-size:27px;font-weight:600;line-height:1;}
  .kpi .s{font-size:11px;color:var(--grey-dim);margin-top:6px;}

  table.month-table{width:100%;border-collapse:separate;border-spacing:0;}
  .row-wrap{display:flex;flex-direction:column;gap:8px;}
  .item-row{background:var(--card);border-radius:var(--row-radius);padding:var(--row-pad);border:1px solid transparent;transition:.15s;}
  .habit-note{width:100%;background:transparent;border:none;color:var(--grey);font-size:11.5px;font-family:var(--font-body);
    padding:0 0 6px;margin-top:-2px;}
  .habit-note::placeholder{color:var(--grey-dim);}
  .habit-note:focus{outline:none;color:var(--white);}
  .item-row:hover{border-color:var(--border);}
  .item-row .top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:7px;}
  .item-row input.name{background:transparent;border:none;color:var(--white);font-size:13.5px;font-weight:600;
    width:100%;padding:2px 0;font-family:var(--font-body);}
  .item-row input.name:focus{outline:none;border-bottom:1px solid var(--amber);}
  .pct-pill{font-size:11px;font-weight:800;font-family:'JetBrains Mono',monospace;padding:3px 9px;border-radius:20px;white-space:nowrap;}
  .days-scroll{display:flex;gap:3px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none;-ms-overflow-style:none;}
  .days-scroll::-webkit-scrollbar{display:none;height:0;}
  .day-cell{flex:0 0 auto;width:27px;height:27px;border-radius:8px;background:var(--card2);
    display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--grey-dim);
    font-family:'JetBrains Mono',monospace;cursor:pointer;border:1px solid transparent;user-select:none;transition:.12s;}
  .day-cell:hover{border-color:var(--amber);}
  .day-cell.done{background:linear-gradient(150deg,var(--amber2),var(--amber));color:var(--on-accent);font-weight:800;border-color:transparent;}
  .day-cell.frozen{background:var(--card);color:var(--frozen-fg);border-color:var(--frozen-border);}
  .progress-bar{height:6px;border-radius:5px;background:var(--card2);margin-top:7px;overflow:hidden;}
  .progress-bar .fill{height:100%;background:linear-gradient(90deg,var(--amber),var(--amber2));border-radius:5px;}

  .type-toggle{background:var(--card2);border:1px solid var(--border);color:var(--grey);border-radius:8px;
    padding:3px 8px;font-size:13px;cursor:pointer;line-height:1;}
  .type-toggle:hover{border-color:var(--amber);}
  .counter-target{width:42px;background:var(--card2);border:1px solid var(--border);color:var(--white);
    border-radius:7px;padding:3px 5px;font-size:11px;font-family:'JetBrains Mono',monospace;text-align:center;}

  .todo-row{display:grid;grid-template-columns:24px 1fr 130px 112px 24px;gap:8px;align-items:center;
    background:var(--card);border-radius:10px;padding:8px 9px;margin-bottom:6px;}
  .todo-row .chk{width:20px;height:20px;border-radius:6px;border:1.5px solid var(--grey-dim);cursor:pointer;
    display:flex;align-items:center;justify-content:center;font-size:11px;flex:0 0 auto;}
  .todo-row .chk.done{background:var(--green);border-color:var(--green);}
  .todo-row .chk.done::after{content:'✔';color:var(--on-green);font-size:11px;}
  .todo-row.done .todo-text{color:var(--grey-dim);text-decoration:line-through;}
  .todo-text{background:transparent;border:none;color:var(--white);font-size:13px;width:100%;}
  .todo-text:focus{outline:none;}
  .todo-date,.todo-priority{background:var(--card2);border:1px solid var(--border);color:var(--white);
    border-radius:7px;padding:4px 6px;font-size:11px;width:100%;}
  .todo-date.overdue{border-color:var(--pink);color:var(--pink);}
  .todo-date.due-today{border-color:var(--amber2);color:var(--amber2);}
  @media(max-width:600px){.todo-row{grid-template-columns:24px 1fr 60px;grid-template-areas:"chk text del" "chk date pri";}
    .todo-row .chk{grid-area:chk;} .todo-text{grid-area:text;} .todo-date{grid-area:date;}
    .todo-priority{grid-area:pri;} .todo-row button{grid-area:del;justify-self:end;}}

  .appearance-grid{display:flex;flex-wrap:wrap;gap:16px;}
  .ap-label{font-size:10px;color:var(--grey);text-transform:uppercase;letter-spacing:.6px;
    font-weight:700;margin-bottom:6px;}
  .seg{display:inline-flex;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:3px;gap:3px;}
  .seg button{background:transparent;border:none;color:var(--grey);font-size:12px;font-weight:600;
    padding:6px 12px;border-radius:8px;cursor:pointer;font-family:var(--font-body);transition:.15s;}
  .seg button:hover{color:var(--white);}
  .seg button.active{background:linear-gradient(100deg,var(--amber),var(--amber2));color:var(--on-accent);}

  /* ---- shell: topbar + bottom tabbar + subnav ---- */
  .topbar{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:6px 4px 4px;}
  .tb-left{min-width:0;}
  .today-label{margin:0;font-size:10.5px;letter-spacing:2px;text-transform:uppercase;
    color:var(--grey);font-weight:600;font-family:var(--font-body);}
  .tb-actions{display:flex;gap:7px;flex:0 0 auto;}
  .icon-btn{width:38px;height:38px;border-radius:11px;background:var(--panel);border:1px solid var(--border);
    color:var(--grey);font-size:17px;cursor:pointer;transition:.15s;line-height:1;
    display:flex;align-items:center;justify-content:center;font-family:inherit;}
  .icon-btn:hover{color:var(--white);border-color:var(--amber);}
  .icon-btn.on{background:var(--amber);color:var(--on-accent);border-color:transparent;}
  .icon-btn:focus-visible{outline:2px solid var(--amber2);outline-offset:2px;}

  nav.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;
    background:color-mix(in srgb, var(--bg) 93%, transparent);backdrop-filter:blur(14px);
    border-top:1px solid var(--border);padding:9px 6px calc(14px + env(safe-area-inset-bottom));}
  nav.tabbar button{flex:1;background:none;border:none;color:var(--grey);cursor:pointer;
    font-family:var(--font-body);font-size:9.5px;font-weight:600;letter-spacing:.2px;padding:2px;
    display:flex;flex-direction:column;align-items:center;gap:3px;transition:.15s;border-radius:9px;}
  nav.tabbar button .ic{font-size:17px;line-height:1;opacity:.55;}
  nav.tabbar button:hover{color:var(--white);}
  nav.tabbar button.active{color:var(--amber);}
  nav.tabbar button.active .ic{opacity:1;}
  nav.tabbar button:focus-visible{outline:2px solid var(--amber2);outline-offset:-2px;}
  @media(min-width:760px){
    nav.tabbar{position:sticky;top:0;bottom:auto;border-top:none;border-bottom:1px solid var(--border);
      padding:6px 4px;margin-bottom:14px;}
    nav.tabbar button{flex:0 0 auto;flex-direction:row;gap:7px;font-size:13px;padding:9px 15px;}
    nav.tabbar button .ic{font-size:14px;}
    nav.tabbar button.active{background:var(--amber);color:var(--on-accent);border-radius:9px;}
  }

  .subnav{display:flex;gap:5px;margin-bottom:12px;overflow-x:auto;scrollbar-width:none;}
  .subnav::-webkit-scrollbar{display:none;}
  .subnav button{flex:0 0 auto;background:var(--card);border:1px solid var(--border);color:var(--grey);
    padding:7px 14px;border-radius:18px;font-size:12.5px;font-weight:600;cursor:pointer;
    font-family:var(--font-body);transition:.15s;}
  .subnav button:hover{color:var(--white);}
  .subnav button.on{background:var(--card2);color:var(--amber);border-color:var(--amber);}
  .subnav button:focus-visible{outline:2px solid var(--amber2);outline-offset:2px;}

  /* ---- today screen (mockup A) ---- */
  .today-head{margin-bottom:20px;}
  .today-head h2{font-family:var(--font-display);font-size:30px;font-weight:400;margin:6px 0 0;
    line-height:1.16;letter-spacing:.1px;text-transform:none;color:var(--white);}
  .today-head h2 em{font-style:italic;color:var(--amber);}
  .today-head .th-sub{margin:8px 0 0;font-size:12px;color:var(--grey);}

  .focus-card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius-card);
    padding:20px;margin-bottom:14px;}
  .focus-card .lbl{font-size:10.5px;letter-spacing:1.6px;text-transform:uppercase;color:var(--amber);
    font-weight:700;margin-bottom:12px;}
  .focus-card.empty .lbl{color:var(--green);}
  .focus-card .task{font-size:19px;font-weight:600;line-height:1.3;margin-bottom:6px;}
  .focus-card .meta{font-size:12.5px;color:var(--grey);}
  .focus-card .go{margin-top:16px;width:100%;background:var(--amber);color:var(--on-accent);
    border:none;border-radius:10px;padding:11px 18px;font-weight:700;font-size:13.5px;
    font-family:var(--font-body);cursor:pointer;transition:.15s;}
  .focus-card .go:hover{background:var(--amber2);}
  .focus-card .go:focus-visible{outline:2px solid var(--amber2);outline-offset:2px;}

  .quiet-summary{font-size:12px;color:var(--grey);line-height:1.65;padding:2px 2px 6px;margin-bottom:14px;}
  .quiet-summary b{color:var(--white);font-weight:600;}

  .fd-time{flex:0 0 auto;width:34px;font-family:'JetBrains Mono',monospace;font-size:10px;
    color:var(--grey-dim);margin-top:3px;text-align:right;}

  .retro-row{display:flex;align-items:center;gap:9px;margin-bottom:7px;}
  .retro-row .rr-name{flex:0 0 92px;font-size:12px;color:var(--grey);overflow:hidden;
    text-overflow:ellipsis;white-space:nowrap;}
  .retro-row .rr-bar{flex:1;height:13px;background:var(--card);border-radius:7px;overflow:hidden;}
  .retro-row .rr-bar span{display:block;height:100%;border-radius:7px;}
  .retro-row .rr-num{flex:0 0 auto;min-width:56px;text-align:right;font-family:'JetBrains Mono',monospace;
    font-size:11px;color:var(--grey);}

  .day-feed{display:flex;flex-direction:column;gap:1px;background:var(--border);
    border-radius:var(--radius-row);overflow:hidden;}
  .fd-entry{display:flex;align-items:flex-start;gap:11px;padding:13px 14px;background:var(--panel);}
  .fd-mark{flex:0 0 auto;font-size:9px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;
    padding:3px 7px;border-radius:4px;margin-top:1px;min-width:64px;text-align:center;
    font-family:var(--font-body);}
  .fd-mark.hab{background:var(--ok-bg);color:var(--ok-fg);}
  .fd-mark.mon{background:var(--info-bg);color:var(--info-fg);}
  .fd-mark.todo{background:var(--card2);color:var(--grey);}
  .fd-mark.note{background:var(--warn-bg1);color:var(--warn-fg);}
  .fd-body{flex:1;min-width:0;font-size:13.5px;line-height:1.5;}
  .fd-text{font-weight:500;}
  .fd-amt{font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:500;margin-left:8px;}
  .fd-amt.pos{color:var(--green);} .fd-amt.neg{color:var(--pink);}
  .fd-note{display:block;font-size:10.5px;color:var(--grey-dim);margin-top:3px;
    font-family:'JetBrains Mono',monospace;}
  .fd-quote{font-size:13px;color:var(--grey);line-height:1.6;font-style:italic;margin-top:2px;}
  .fd-entry.done .fd-text{color:var(--grey);}
  .fd-entry.frozen .fd-text{color:var(--frozen-fg);}
  .fd-tick{flex:0 0 auto;width:17px;height:17px;margin-top:3px;border-radius:50%;background:transparent;
    border:1.5px solid var(--grey);cursor:pointer;font-size:0;transition:.15s;padding:0;color:transparent;}
  .fd-tick:hover{border-color:var(--amber);background:var(--card2);}
  .fd-tick:focus-visible{outline:2px solid var(--amber2);outline-offset:2px;}


  /* ---- console look (mockup Б): dense grid, mono numerals, icon rail ---- */
  .con-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:10px;}
  .con-grid .cell{background:var(--panel);border:1px solid var(--border);border-radius:7px;padding:9px 10px;}
  .con-grid .cell.wide{grid-column:1/-1;}
  .con-grid .k{font-size:8.5px;text-transform:uppercase;letter-spacing:1.1px;color:var(--grey);
    font-weight:700;margin-bottom:5px;}
  .con-grid .v{font-family:'JetBrains Mono',monospace;font-size:17px;font-weight:700;letter-spacing:-.5px;
    color:var(--white);}
  .con-grid .v.teal{color:var(--amber);} .con-grid .v.warn{color:var(--pink);} .con-grid .v.gold{color:var(--purple);}
  .con-grid .sub{font-size:9.5px;color:var(--grey);margin-top:3px;font-family:'JetBrains Mono',monospace;}
  .con-grid .spark{display:flex;align-items:flex-end;gap:1.5px;height:22px;margin-top:7px;}
  .con-grid .spark span{flex:1;border-radius:1px;opacity:.8;background:var(--grey-dim);}
  .con-grid .spark span.teal{background:var(--amber);}
  .con-grid .spark span.warn{background:var(--pink);}
  .con-tbl{width:100%;border-collapse:collapse;font-family:'JetBrains Mono',monospace;font-size:10.5px;
    color:var(--white);}
  .con-tbl td{padding:4.5px 0;border-bottom:1px solid var(--border);}
  .con-tbl td:last-child{text-align:right;color:var(--grey);}
  .con-tbl tr:last-child td{border-bottom:none;}
  .con-grid .tag{font-size:8.5px;padding:1.5px 5px;border-radius:3px;background:var(--card2);color:var(--grey);
    text-transform:uppercase;letter-spacing:.7px;font-weight:700;}
  .con-grid .tag.hot{background:var(--bad-bg);color:var(--bad-fg);}
  .con-grid .streak{display:flex;gap:2px;}
  .con-grid .streak span{width:8px;height:8px;border-radius:2px;background:var(--card2);}
  .con-grid .streak span.f{background:var(--amber);}
  .con-grid .streak span.z{background:var(--frozen-border);}
  .con-bar{display:flex;gap:0;height:5px;margin-top:8px;border-radius:3px;overflow:hidden;}
  .con-bar span{background:var(--amber);}
  .con-bar span.rest{background:var(--card2);}

  /* console: icon-only rail, labels hidden */
  html[data-look="console"] nav.tabbar button .lbl{display:none;}
  html[data-look="console"] nav.tabbar button{gap:0;padding:8px 2px;}
  html[data-look="console"] nav.tabbar button .ic{font-size:19px;}
  html[data-look="console"] nav.tabbar button.active .ic{opacity:1;}
  html[data-look="console"] .today-head h2{font-size:15px;font-weight:700;letter-spacing:-.2px;}
  html[data-look="console"] .card h2{font-size:11px;letter-spacing:1px;}
  @media(min-width:760px){
    html[data-look="console"] nav.tabbar button .lbl{display:inline;}
  }

  .arch-btn{background:var(--card2);border:1px solid var(--border);color:var(--grey);border-radius:7px;
    padding:3px 8px;font-size:12px;cursor:pointer;line-height:1;font-family:inherit;}
  .arch-btn:hover{border-color:var(--amber);color:var(--white);}
  .arch-block{margin-top:12px;border-top:1px solid var(--border);padding-top:10px;}
  .arch-block summary{cursor:pointer;font-size:11.5px;color:var(--grey);font-weight:600;
    letter-spacing:.3px;list-style:none;}
  .arch-block summary::-webkit-details-marker{display:none;}
  .arch-block summary::before{content:'▸ ';color:var(--grey-dim);}
  .arch-block[open] summary::before{content:'▾ ';}
  .arch-row{display:flex;align-items:center;gap:9px;padding:8px 0;border-bottom:1px solid var(--border);}
  .arch-row:last-child{border-bottom:none;}
  .arch-name{flex:1;font-size:12.5px;color:var(--grey);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .arch-meta{flex:0 0 auto;font-size:10px;color:var(--grey-dim);font-family:'JetBrains Mono',monospace;}
  .arch-row .btn.ghost{padding:4px 10px;font-size:11px;}

  .undo-toast{position:fixed;left:50%;transform:translate(-50%,20px);z-index:80;
    bottom:calc(78px + env(safe-area-inset-bottom));
    background:var(--card2);border:1px solid var(--border);border-radius:12px;
    padding:10px 12px 10px 15px;display:flex;align-items:center;gap:12px;
    box-shadow:var(--shadow);opacity:0;transition:opacity .25s,transform .25s;
    font-size:12.5px;color:var(--white);max-width:calc(100vw - 28px);}
  .undo-toast.show{opacity:1;transform:translate(-50%,0);}
  .undo-toast span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .undo-toast button{flex:0 0 auto;background:var(--amber);color:var(--on-accent);border:none;
    border-radius:8px;padding:6px 13px;font-weight:700;font-size:12px;cursor:pointer;font-family:var(--font-body);}
  .undo-toast button:focus-visible{outline:2px solid var(--amber2);outline-offset:2px;}
  @media(min-width:760px){.undo-toast{bottom:20px;}}

  .look-grid{display:flex;gap:9px;flex-wrap:wrap;}
  .look-card{flex:1;min-width:135px;background:var(--card);border:1.5px solid var(--border);
    border-radius:12px;padding:11px;cursor:pointer;text-align:left;font-family:inherit;
    display:flex;flex-direction:column;gap:6px;transition:.15s;}
  .look-card:hover{border-color:var(--grey);}
  .look-card.on{border-color:var(--amber);}
  .look-card:focus-visible{outline:2px solid var(--amber2);outline-offset:2px;}
  .look-card .lk-prev{display:flex;flex-direction:column;gap:3px;height:34px;justify-content:center;
    border-radius:6px;padding:6px 7px;}
  .look-card .lk-prev i{display:block;height:4px;border-radius:2px;}
  .look-card .lk-prev.focus{background:#191E1B;}
  .look-card .lk-prev.focus i:nth-child(1){width:62%;background:#F2C14E;}
  .look-card .lk-prev.focus i:nth-child(2){width:88%;background:#2A322D;}
  .look-card .lk-prev.focus i:nth-child(3){width:44%;background:#2A322D;}
  .look-card .lk-prev.console{background:#0B0C0E;flex-direction:row;align-items:flex-end;gap:2px;}
  .look-card .lk-prev.console i{height:100%;width:5px;border-radius:1px;background:#232830;}
  .look-card .lk-prev.console i:nth-child(1){background:#4FD1C5;height:70%;}
  .look-card .lk-prev.console i:nth-child(2){height:45%;}
  .look-card .lk-prev.console i:nth-child(3){background:#4FD1C5;height:90%;}
  .look-card .lk-name{font-size:13px;font-weight:700;color:var(--white);}
  .look-card.on .lk-name{color:var(--amber2);}
  .look-card .lk-hint{font-size:10.5px;color:var(--grey-dim);line-height:1.35;}

  .search-input{width:100%;background:var(--card2);border:1px solid var(--border);border-radius:10px;
    color:var(--white);padding:10px 13px;font-size:13.5px;}
  .search-input:focus{outline:none;border-color:var(--amber);}
  .search-result-row{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:10px;
    padding:10px;margin-bottom:6px;cursor:pointer;transition:.12s;border:1px solid transparent;}
  .search-result-row:hover{border-color:var(--amber);}
  .sr-icon{font-size:16px;flex:0 0 auto;}
  .sr-body{flex:1;min-width:0;}
  .sr-title{font-size:13px;color:var(--white);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .sr-meta{font-size:10.5px;color:var(--grey-dim);margin-top:2px;}
  .sr-arrow{color:var(--grey-dim);font-size:13px;flex:0 0 auto;}

  .add-row{display:flex;gap:8px;margin-top:10px;}
  .add-row input{flex:1;background:var(--card);border:1px solid var(--border);border-radius:10px;color:var(--white);padding:9px 12px;font-size:13px;}
  .add-row button, .btn{background:linear-gradient(100deg,var(--amber),var(--amber2));color:var(--on-accent);border:none;
    border-radius:10px;padding:9px 15px;font-weight:700;cursor:pointer;font-size:13px;transition:.15s;}
  .add-row button:hover, .btn:hover{transform:translateY(-1px);box-shadow:0 6px 16px -6px rgba(232,112,58,.6);}
  .btn.pink{background:var(--pink);color:var(--on-pink);}
  .btn.ghost{background:transparent;border:1px solid var(--border);color:var(--grey);box-shadow:none;}
  .del{background:none;border:none;color:var(--grey-dim);cursor:pointer;font-size:15px;padding:2px 6px;}
  .del:hover{color:var(--pink);}

  /* plan categories */
  .plan-grid{display:grid;grid-template-columns:1fr;gap:12px;}
  @media(min-width:720px){.plan-grid{grid-template-columns:1fr 1fr;}}
  .plan-cat{border-radius:14px;overflow:hidden;border:1px solid var(--border);box-shadow:var(--shadow);}
  .plan-cat .hd{padding:9px 13px;font-weight:800;font-size:12px;color:var(--on-accent);letter-spacing:.3px;
    display:flex;align-items:center;gap:6px;}
  .plan-cat .hd input.cat-name-input{flex:1;background:transparent;border:none;color:var(--on-accent);font-weight:800;
    font-size:12px;letter-spacing:.3px;text-transform:uppercase;font-family:var(--font-body);padding:2px 0;min-width:0;}
  .plan-cat .hd input.cat-name-input:focus{outline:none;}
  .plan-cat .hd .cat-del{color:var(--on-accent);opacity:.65;font-size:13px;}
  .plan-cat .hd .cat-del:hover{opacity:1;color:var(--on-accent);}
  .plan-cat .body{background:var(--card);padding:9px;display:flex;flex-direction:column;gap:6px;}
  .plan-item{display:flex;align-items:center;gap:8px;}
  .plan-item .chk{width:20px;height:20px;border-radius:6px;border:1.5px solid var(--grey-dim);flex:0 0 auto;cursor:pointer;
    display:flex;align-items:center;justify-content:center;font-size:12px;transition:.12s;}
  .plan-item .chk.done{background:var(--green);border-color:var(--green);color:var(--on-green);}
  .plan-item .chk.frozen{background:var(--card);border-color:var(--frozen-border);color:var(--frozen-fg);font-size:10px;}
  .plan-item input{flex:1;background:transparent;border:none;color:var(--white);font-size:13px;}
  .plan-item input:focus{outline:none;}
  .plan-item.done input{color:var(--grey-dim);text-decoration:line-through;}

  /* finance */
  .fin-summary{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;}
  .fin-summary .box{flex:1;min-width:110px;background:var(--card);border-radius:12px;padding:11px;}
  .fin-summary .box .l{font-size:10px;color:var(--grey);text-transform:uppercase;letter-spacing:.4px;}
  .fin-summary .box .v{font-family:var(--font-display);font-size:19px;font-weight:600;margin-top:3px;}
  .fin-entry-wrap{margin-bottom:8px;}
  .fin-log-row{display:grid;grid-template-columns:100px 80px 65px 90px 1fr 24px;gap:6px;align-items:center;
    background:var(--card);border-radius:10px;padding:7px 9px;}
  .fin-log-row input,.fin-log-row select{background:var(--card2);border:1px solid var(--border);color:var(--white);
    border-radius:7px;padding:5px 7px;font-size:12px;width:100%;}
  .fin-comment{width:100%;background:var(--card2);border:1px solid var(--border);color:var(--white);
    border-radius:7px;padding:5px 7px;font-size:11.5px;margin-top:4px;}
  @media(max-width:680px){.fin-log-row{grid-template-columns:1fr 1fr;grid-template-areas:"date type" "amount acc" "cat cat" "del del";}
    .fin-log-row input[data-f="date"]{grid-area:date;} .fin-log-row input[data-f="amount"]{grid-area:amount;}
    .fin-log-row select[data-f="type"]{grid-area:type;} .fin-log-row select[data-f="accountId"]{grid-area:acc;}
    .fin-log-row select[data-f="category"]{grid-area:cat;} .fin-log-row button{grid-area:del;justify-self:end;}}

  .rec-row{display:grid;grid-template-columns:44px 70px 60px 90px 1fr 1fr 24px;gap:6px;align-items:center;
    background:var(--card);border-radius:10px;padding:7px 9px;margin-bottom:6px;}
  .rec-row input,.rec-row select{background:var(--card2);border:1px solid var(--border);color:var(--white);
    border-radius:7px;padding:5px 7px;font-size:12px;width:100%;}
  @media(max-width:640px){.rec-row{grid-template-columns:1fr 1fr;grid-template-areas:"day amount" "type acc" "cat cat" "name name" "del del";}
    .rec-row input[data-rf="day"]{grid-area:day;} .rec-row input[data-rf="amount"]{grid-area:amount;}
    .rec-row select[data-rf="type"]{grid-area:type;} .rec-row select[data-rf="accountId"]{grid-area:acc;}
    .rec-row select[data-rf="category"]{grid-area:cat;}
    .rec-row input[data-rf="comment"]{grid-area:name;} .rec-row button{grid-area:del;justify-self:end;}}

  .acc-row{display:grid;grid-template-columns:1fr 80px 110px 24px;gap:6px;align-items:center;
    background:var(--card);border-radius:10px;padding:7px 9px;margin-bottom:6px;}
  .acc-row input,.acc-row select{background:var(--card2);border:1px solid var(--border);color:var(--white);
    border-radius:7px;padding:5px 7px;font-size:12px;width:100%;}
  .acc-row .acc-balance{font-family:'JetBrains Mono',monospace;font-size:12.5px;font-weight:700;text-align:right;}
  @media(max-width:520px){.acc-row{grid-template-columns:1fr 1fr;grid-template-areas:"name name" "cur bal" "del del";}
    .acc-row input{grid-area:name;} .acc-row select{grid-area:cur;} .acc-row .acc-balance{grid-area:bal;} .acc-row button{grid-area:del;justify-self:end;}}

  .transfer-row{display:grid;grid-template-columns:100px 1fr 1fr 80px 80px 24px;gap:6px;align-items:center;
    background:var(--card);border-radius:10px;padding:7px 9px;margin-bottom:6px;}
  .transfer-row input,.transfer-row select{background:var(--card2);border:1px solid var(--border);color:var(--white);
    border-radius:7px;padding:5px 7px;font-size:12px;width:100%;}
  @media(max-width:640px){.transfer-row{grid-template-columns:1fr 1fr;grid-template-areas:"date date" "from to" "amount toamount" "del del";}
    .transfer-row input[data-tf="date"]{grid-area:date;} .transfer-row select[data-tf="fromAccountId"]{grid-area:from;}
    .transfer-row select[data-tf="toAccountId"]{grid-area:to;} .transfer-row input[data-tf="amount"]{grid-area:amount;}
    .transfer-row input[data-tf="toAmount"]{grid-area:toamount;} .transfer-row button{grid-area:del;justify-self:end;}}

  .fin-filter-bar{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px;}
  .fin-filter-bar input,.fin-filter-bar select{background:var(--card2);border:1px solid var(--border);color:var(--white);
    border-radius:7px;padding:6px 8px;font-size:12px;}
  .fin-filter-bar input#finSearchQ{flex:1;min-width:140px;}

  /* savings */
  .savings-goal{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;}
  @media(max-width:600px){.savings-goal{grid-template-columns:1fr;}}
  .savings-goal label{font-size:11px;color:var(--grey);display:block;margin-bottom:4px;}
  .savings-goal input{width:100%;background:var(--card);border:1px solid var(--border);color:var(--white);
    border-radius:10px;padding:9px 11px;font-size:13px;}
  .day-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(56px,1fr));gap:6px;}
  .day-chip{background:var(--card);border-radius:10px;padding:6px 4px;text-align:center;cursor:pointer;border:1px solid var(--border);}
  .day-chip.done{background:var(--amber);color:var(--on-accent);border-color:var(--amber);}
  .day-chip .d{font-size:9px;color:inherit;opacity:.8;}
  .day-chip .n{font-size:11px;font-weight:700;}

  .empty{color:var(--grey-dim);font-size:13px;text-align:center;padding:22px 0;}

  .goal-pills{display:flex;gap:8px;flex-wrap:wrap;}
  .goal-pill{background:var(--card);border:1px solid var(--border);color:var(--grey);border-radius:14px;
    padding:9px 14px;cursor:pointer;font-size:13px;font-weight:600;display:flex;flex-direction:column;
    align-items:flex-start;gap:2px;transition:.15s;font-family:var(--font-body);}
  .goal-pill .n{white-space:nowrap;max-width:160px;overflow:hidden;text-overflow:ellipsis;}
  .goal-pill .p{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--grey-dim);}
  .goal-pill.active{background:linear-gradient(100deg,var(--amber),var(--amber2));border-color:transparent;}
  .goal-pill.active .n{color:var(--on-accent);}
  .goal-pill.active .p{color:var(--on-accent);}
  .goal-pill:hover{border-color:var(--amber);}
  .goal-pill.add{color:var(--amber2);border-style:dashed;justify-content:center;align-items:center;}
  .cat-chip{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:12px;font-size:12px;font-weight:600;}
  .cat-chip button{background:transparent;border:none;color:inherit;cursor:pointer;font-size:11px;opacity:.7;padding:0;}
  .cat-chip button:hover{opacity:1;}

  /* streaks + year heatmap */
  .streak-pill{font-size:11px;font-weight:800;font-family:'JetBrains Mono',monospace;padding:3px 9px;border-radius:20px;
    background:linear-gradient(100deg,var(--streak-bg1),var(--streak-bg2));color:var(--amber2);white-space:nowrap;
    box-shadow:inset 0 0 0 1px rgba(232,112,58,.35);}
  .heat-row{display:flex;align-items:center;gap:8px;margin-bottom:5px;}
  .heat-label{width:120px;flex:0 0 auto;font-size:11px;color:var(--grey);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .heat-days{display:flex;flex-wrap:wrap;gap:2px;flex:1;}
  .heat-cell{width:8px;height:8px;border-radius:2px;background:var(--card2);}
  .heat-cell.done{background:linear-gradient(150deg,var(--amber2),var(--amber));}
  .motivation{font-size:13px;color:var(--white);font-family:var(--font-display);font-weight:500;
    background:linear-gradient(100deg,rgba(232,112,58,.14),rgba(76,140,136,.10));
    border:1px solid var(--border);border-radius:14px;padding:14px 16px;margin-bottom:14px;}
  .save-note{position:fixed;bottom:14px;right:14px;background:linear-gradient(100deg,var(--amber),var(--amber2));
    color:var(--on-accent);font-weight:700;font-family:var(--font-body);
    font-size:12px;padding:8px 15px;border-radius:20px;opacity:0;transition:opacity .3s;pointer-events:none;
    box-shadow:0 6px 20px -6px rgba(232,112,58,.6);}
  .save-note.show{opacity:1;}
  .rem-banner{position:fixed;top:14px;left:50%;transform:translateX(-50%) translateY(-16px);
    background:linear-gradient(100deg,var(--card2),var(--card));border:1px solid var(--amber);
    color:var(--white);font-family:var(--font-body);font-size:13px;font-weight:600;padding:12px 20px;border-radius:14px;
    opacity:0;transition:.3s ease;box-shadow:var(--shadow);z-index:999;max-width:88vw;text-align:center;pointer-events:none;}
  .rem-banner.show{opacity:1;transform:translateX(-50%) translateY(0);}
  .journal-textarea{width:100%;min-height:240px;background:var(--card);border:1px solid var(--border);border-radius:12px;
    color:var(--white);padding:14px;font-family:var(--font-body);font-size:14px;line-height:1.65;resize:vertical;}
  .journal-textarea:focus{outline:none;border-color:var(--amber);}
  .journal-textarea::placeholder{color:var(--grey-dim);}
  .mood-row{display:flex;gap:8px;margin-bottom:12px;}
  .mood-btn{background:var(--card);border:1px solid var(--border);border-radius:12px;font-size:20px;padding:6px 10px;cursor:pointer;transition:.15s;}
  .mood-btn.active{background:linear-gradient(100deg,var(--amber),var(--amber2));box-shadow:var(--shadow);transform:scale(1.08);}
  .mood-strip{display:flex;flex-wrap:wrap;gap:4px;}
  .mood-day{width:30px;height:30px;display:flex;align-items:center;justify-content:center;background:var(--card);
    border-radius:8px;font-size:15px;}
  .mood-day.today{box-shadow:inset 0 0 0 1.5px var(--amber);}
  .mood-day .dim{color:var(--grey-dim);font-size:10px;font-family:'JetBrains Mono',monospace;}
</style>
</head>
<body>

// ---------- CHART HELPERS (canvas, no deps) ----------
function rr(ctx,x,y,w,h,r){
  if(h<=0.4) return;
  r=Math.max(0,Math.min(r,w/2,Math.abs(h)/2));
  const up = h<0; const hh=Math.abs(h); const yy = up? y+h : y;
  ctx.beginPath();
  ctx.moveTo(x+r,yy);
  ctx.arcTo(x+w,yy,x+w,yy+hh,r);
  ctx.arcTo(x+w,yy+hh,x,yy+hh,r);
  ctx.arcTo(x,yy+hh,x,yy,r);
  ctx.arcTo(x,yy,x+w,yy,r);
  ctx.closePath();
  ctx.fill();
}
function setupCanvas(canvas){
  const dpr = window.devicePixelRatio||1;
  const W = canvas.clientWidth||canvas.parentElement.clientWidth, H = canvas.clientHeight||160;
  canvas.width = Math.max(1,W*dpr); canvas.height = Math.max(1,H*dpr);
  const ctx = canvas.getContext('2d');
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,W,H);
  return {ctx,W,H};
}
function drawGroupedBars(canvasId, labels, series){
  const canvas=document.getElementById(canvasId); if(!canvas) return;
  const {ctx,W,H}=setupCanvas(canvas);
  const padL=6, padR=6, padT=10, padB=18;
  const chartW=W-padL-padR, chartH=H-padT-padB;
  const n=labels.length;
  const groupW=chartW/n;
  const gap=2, barW=(groupW-gap*(series.length+1))/series.length;
  const max=Math.max(1,...series.flatMap(s=>s.data));
  ctx.font="9px 'JetBrains Mono',monospace"; ctx.textAlign="center";
  for(let i=0;i<n;i++){
    const x0=padL+i*groupW;
    series.forEach((s,si)=>{
      const v=s.data[i]||0;
      const h=(v/max)*chartH;
      ctx.fillStyle=s.color;
      rr(ctx, x0+gap+si*(barW+gap), padT+chartH-h, barW, h, 3);
    });
    ctx.fillStyle=cssVar("--grey");
    ctx.fillText(labels[i], x0+groupW/2, H-4);
  }
}
function drawLineArea(canvasId, labels, values, color, color2, goal){
  const canvas=document.getElementById(canvasId); if(!canvas) return;
  const {ctx,W,H}=setupCanvas(canvas);
  const padL=8, padR=8, padT=12, padB=18;
  const chartW=W-padL-padR, chartH=H-padT-padB;
  const n=values.length;
  const max=Math.max(1, goal||0, ...values);
  const stepX = n>1? chartW/(n-1) : chartW;
  const pts = values.map((v,i)=>[padL+i*stepX, padT+chartH-(v/max)*chartH]);

  if(goal){
    const gy = padT+chartH-(goal/max)*chartH;
    ctx.setLineDash([4,4]); ctx.strokeStyle=cssVar("--grey-dim"); ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(padL,gy); ctx.lineTo(W-padR,gy); ctx.stroke();
    ctx.setLineDash([]);
  }
  if(pts.length>1){
    const grad=ctx.createLinearGradient(0,padT,0,padT+chartH);
    grad.addColorStop(0, color2+"55"); grad.addColorStop(1, color2+"05");
    ctx.beginPath(); ctx.moveTo(pts[0][0],padT+chartH);
    pts.forEach(p=>ctx.lineTo(p[0],p[1]));
    ctx.lineTo(pts[pts.length-1][0],padT+chartH); ctx.closePath();
    ctx.fillStyle=grad; ctx.fill();

    ctx.beginPath(); ctx.moveTo(pts[0][0],pts[0][1]);
    for(let i=1;i<pts.length;i++) ctx.lineTo(pts[i][0],pts[i][1]);
    ctx.strokeStyle=color; ctx.lineWidth=2.2; ctx.lineJoin="round"; ctx.stroke();
  }
  pts.forEach(p=>{ ctx.beginPath(); ctx.arc(p[0],p[1],2.6,0,7); ctx.fillStyle=color; ctx.fill(); });
  ctx.font="9px 'JetBrains Mono',monospace"; ctx.fillStyle=cssVar("--grey"); ctx.textAlign="center";
  const step=Math.ceil(n/8);
  labels.forEach((l,i)=>{ if(i%step===0 || i===n-1) ctx.fillText(l, padL+i*stepX, H-4); });
}

function escapeHtml(s){
  return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

function pad2(n){ return String(n).padStart(2,'0'); }
// Canvas can't read CSS variables directly, so charts resolve theme colours through this.
function cssVar(name, fallback){
  const v=getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  return v || fallback || '#888';
}
const APPEARANCE_DEFAULTS={look:"focus", theme:"dark", density:"comfortable"};
function appearance(){
  if(!DATA.settings) DATA.settings={...APPEARANCE_DEFAULTS};

function isConsole(){ return appearance().look==="console"; }

function shiftDay(delta){
  const d=new Date(cur.year, cur.monthIdx, cur.day);
  d.setDate(d.getDate()+delta);
  cur.year=d.getFullYear(); cur.monthIdx=d.getMonth(); cur.day=d.getDate();

// Parses "YYYY-MM-DD" as a local date. Plain `new Date(str)` parses this shape
// as UTC midnight, which can shift the day/month in negative-UTC timezones.
function parseLocalDate(s){
  if(!s) return null;
  const p=s.split('-').map(Number);
  if(p.length!==3 || p.some(isNaN)) return null;
  return new Date(p[0], p[1]-1, p[2]);
}
function addMonthsToDate(date, months){
  const d=new Date(date);
  d.setMonth(d.getMonth()+months);
  return d;
}
// A habit's monthly goal shouldn't exceed the number of days actually in that month,
// and days the user has frozen (vacation/sick) don't count toward the requirement either.
function habitGoal(idx, year, monthIdx){
  const raw=(DATA.habits.goals && DATA.habits.goals[idx]) || 21;
  const nd=daysInMonth(year, monthIdx);
  const key=`${year}-${monthIdx}`;
  const frozenCount=(DATA.habits.frozen && DATA.habits.frozen[key] && DATA.habits.frozen[key][idx]) ? DATA.habits.frozen[key][idx].length : 0;
  const availableDays=Math.max(1, nd-frozenCount);
  return Math.min(raw, availableDays);
}
function getWeekStart(date){
  const d=new Date(date); d.setHours(0,0,0,0);
  const day=(d.getDay()+6)%7; // Monday = 0
  d.setDate(d.getDate()-day);
  return d;
}
function getWeekDates(anchorMs){
  const start=getWeekStart(new Date(anchorMs));
  const arr=[];
  for(let i=0;i<7;i++){ const dt=new Date(start); dt.setDate(start.getDate()+i); arr.push(dt); }
  return arr;
}
// Projects when a savings goal will be reached based on the average monthly
// contribution rate seen so far (total saved / number of calendar months
// since the first contribution).
function projectSavingsCompletion(entries, remaining){
  if(remaining<=0) return null;
  const withAmount=(entries||[]).filter(e=>e.date && (+e.amount||0)!==0);
  if(!withAmount.length) return null;
  const sortedDates=withAmount.map(e=>e.date).sort();
  const first=parseLocalDate(sortedDates[0]);
  if(!first) return null;
  const now=new Date();
  const monthsSpan=Math.max(1,(now.getFullYear()-first.getFullYear())*12+(now.getMonth()-first.getMonth())+1);
  const totalSaved=withAmount.reduce((s,e)=>s+(+e.amount||0),0);
  const avgMonthly=totalSaved/monthsSpan;
  if(avgMonthly<=0) return null;
  const monthsNeeded=Math.ceil(remaining/avgMonthly);
  return {avgMonthly, target:addMonthsToDate(now, monthsNeeded)};
}

let DATA=null;
let cur = { tab:"today", sub:{rhythm:"habits", doing:"todos", money:"finance"}, monthIdx: new Date().getMonth(), year: new Date().getFullYear(), day: new Date().getDate(), savingsGoalIdx: 0, habitView:"month", weekAnchor: Date.now(), finFilter:{type:"",accountId:"",category:"",q:"",from:"",to:""}, searchQuery:"" };

const CHUNK_SIZE = 3500;

async function tgGetItem(key){
  return new Promise(res=>TG.CloudStorage.getItem(key,(err,v)=>res(err?null:(v||null))));
}
async function tgSetItem(key,value){
  return new Promise(res=>TG.CloudStorage.setItem(key,value,()=>res(true)));
}
async function tgRemoveItem(key){
  return new Promise(res=>TG.CloudStorage.removeItem(key,()=>res(true)));
}

async function storageGet(key){
  if(TG && TG.CloudStorage){
    const meta = await tgGetItem(key+"-meta");
    if(!meta) return null;
    const count = parseInt(meta,10) || 0;
    let full = "";
    for(let i=0;i<count;i++){
      const part = await tgGetItem(`${key}-c${i}`);
      full += (part||"");
    }
    return full || null;
  } else if(window.storage){
    try{ const r = await window.storage.get(key,false); return r? r.value : null; }catch(e){ return null; }
  } else {
    try{ return localStorage.getItem(key); }catch(e){ return null; }
  }
}
async function storageSet(key,value){
  if(TG && TG.CloudStorage){
    const chunks=[];
    for(let i=0;i<value.length;i+=CHUNK_SIZE) chunks.push(value.slice(i,i+CHUNK_SIZE));
    for(let i=0;i<chunks.length;i++) await tgSetItem(`${key}-c${i}`,chunks[i]);
    await tgSetItem(key+"-meta", String(chunks.length));
    return true;
  } else if(window.storage){
    try{ await window.storage.set(key,value,false); return true; }catch(e){ return false; }
  } else {
    try{ localStorage.setItem(key,value); return true; }catch(e){ return false; }
  }
}

  if(!DATA.habits.counterTargets) DATA.habits.counterTargets = {};
  if(!DATA.habits.counts) DATA.habits.counts = {};
  if(!DATA.habits.frozen) DATA.habits.frozen = {};
  if(!DATA.habits.times) DATA.habits.times = {};
  if(!DATA.habits.archived) DATA.habits.archived = {};
  if(!DATA.journalMood) DATA.journalMood = {};

  applyAppearance();

  render();
  maybeAutoBackup();
}

function scheduleSave(){
  clearTimeout(saveTimer);

}
// ---------- MORNING SUMMARY BOT ----------
// The Bot API cannot read CloudStorage, so the app pushes a snapshot to a small
// worker; the worker recomputes the summary each morning and sends it.
// Throttled — every keystroke triggers a save, but not a network call.
let lastSync=0, syncTimer=null;
function botConfigured(){
  const s=appearance();
  return !!(s.botOn && s.botUrl && TG && TG.initData);
}
async function syncToBot(force){
  if(!botConfigured()) return;
  const now=Date.now();
  if(!force && now-lastSync < 60000){
    clearTimeout(syncTimer);
    syncTimer=setTimeout(()=>syncToBot(true), 60000-(now-lastSync));
    return;
  }
  lastSync=now;
  try{
    await fetch(appearance().botUrl.replace(/\/+$/,"")+"/sync", {
      method:"POST",
      headers:{"content-type":"application/json"},
      body:JSON.stringify({ initData:TG.initData, data:DATA, tzOffset:-new Date().getTimezoneOffset() })
    });
  }catch(e){ /* офлайн — синхронизируемся при следующем сохранении */ }
}
async function saveData(){
  try{
    await storageSet("tracker-data-v1", JSON.stringify(DATA));
    const n=document.getElementById("saveNote");
    n.classList.add("show");
    setTimeout(()=>n.classList.remove("show"), 900);
    syncToBot(false);
  }catch(e){ console.error("save failed", e); }
}

// Telegram's in-app browser (especially on iOS) does not reliably support
// triggering a real file download via <a download>: instead of saving the
// file it can navigate the WebView to show the raw JSON content on screen.
// So inside Telegram we never auto-download silently — only remind the
// person to tap "Скачать бэкап" themselves, which is a safer, expected action.
function maybeAutoBackup(){
  const now=Date.now();
  const week=7*24*60*60*1000;
  if(DATA._lastBackup==null){
    DATA._lastBackup=now;
    scheduleSave();
    return;
  }
  if(now-DATA._lastBackup>week){
    showBanner("📥 Не забудь скачать бэкап (Дашборд → Данные)");
    DATA._lastBackup=now;
    scheduleSave();
  }
}

// ---------- YEAR HEATMAP ----------
function bestStreakEver(idx){
  const type=habitType(idx);
  const target=habitCounterTarget(idx);
  const doneDates=new Set();
  const frozenDates=new Set();
  const allKeys=new Set([
    ...Object.keys(DATA.habits.checks||{}),
    ...Object.keys(DATA.habits.counts||{}),
    ...Object.keys(DATA.habits.frozen||{})
  ]);
  allKeys.forEach(key=>{
    const parts=key.split('-'); const y=+parts[0], m=+parts[1];
    if(isNaN(y)||isNaN(m)) return;
    if(type==='counter'){
      const counts=(DATA.habits.counts && DATA.habits.counts[key] && DATA.habits.counts[key][idx]) || {};
      Object.keys(counts).forEach(dStr=>{ if((+counts[dStr]||0)>=target) doneDates.add(new Date(y,m,+dStr).getTime()); });
    } else {
      const arr=(DATA.habits.checks[key]&&DATA.habits.checks[key][idx])||[];
      arr.forEach(d=>doneDates.add(new Date(y,m,d).getTime()));
    }
    const farr=(DATA.habits.frozen && DATA.habits.frozen[key] && DATA.habits.frozen[key][idx]) || [];
    farr.forEach(d=>frozenDates.add(new Date(y,m,d).getTime()));
  });
  if(!doneDates.size) return 0;
  const dates=[...doneDates].sort((a,b)=>a-b);
  let best=1, run=1;
  for(let i=1;i<dates.length;i++){
    const gapDays=Math.round((dates[i]-dates[i-1])/86400000);
    if(gapDays===0) continue;
    if(gapDays===1){ run++; }
    else {
      let allFrozen=true;
      for(let g=1; g<gapDays; g++){
        if(!frozenDates.has(dates[i-1]+g*86400000)){ allFrozen=false; break; }
      }
      run = allFrozen ? run+1 : 1;
    }
    if(run>best) best=run;
  }
  return best;
}
function renderYear(){
  const list=DATA.habits.list;
  const rows=list.map((name,idx)=>{
    let cells="";
    for(let m=0;m<12;m++){
      const nd=daysInMonth(cur.year,m);
      for(let d=1; d<=nd; d++){

      <div class="heat-days">${cells}</div>
    </div>`;
  }).join("");

  // ---- yearly stats ----
  let totalDoneDays=0, bestHabitIdx=-1, bestHabitTotal=-1;

  list.forEach((name,idx)=>{
    let total=0;
    for(let m=0;m<12;m++){

    if(total>bestHabitTotal){ bestHabitTotal=total; bestHabitIdx=idx; }
  });
  let bestMonthIdx=-1, bestMonthTotal=-1;
  monthTotals.forEach((t,i)=>{ if(t>bestMonthTotal){ bestMonthTotal=t; bestMonthIdx=i; } });
  const statsHtml = list.length? `<div class="card">

      <div class="kpi" style="border-top-color:var(--amber)"><div class="t">Отмечено дней всего</div><div class="v">${totalDoneDays}</div><div class="s">по всем привычкам</div></div>
      <div class="kpi" style="border-top-color:var(--purple)"><div class="t">Лучшая привычка</div><div class="v">${bestHabitIdx>=0?escapeHtml(list[bestHabitIdx]):'—'}</div><div class="s">${bestHabitTotal>0?`${bestHabitTotal} дней, рекорд подряд: ${bestStreakEver(bestHabitIdx)}`:'пока нет данных'}</div></div>
      <div class="kpi" style="border-top-color:var(--cyan)"><div class="t">Продуктивный месяц</div><div class="v">${bestMonthTotal>0?MONTHS_RU[bestMonthIdx]:'—'}</div><div class="s">${bestMonthTotal>0?`${bestMonthTotal} отметок`:'пока нет данных'}</div></div>
    </div>
  </div>` : '';

  return `<div class="month-nav">
      <button id="prevY">‹</button>
      <div class="label">${cur.year} год целиком</div>
      <button id="nextY">›</button>

// ---------- HABITS ----------
function isHabitArchived(idx){ return !!(DATA.habits.archived && DATA.habits.archived[idx]); }
function activeHabitIdx(){ return DATA.habits.list.map((_,i)=>i).filter(i=>!isHabitArchived(i)); }
function habitType(idx){ return (DATA.habits.types && DATA.habits.types[idx]) || 'check'; }
function habitCounterTarget(idx){ return (DATA.habits.counterTargets && DATA.habits.counterTargets[idx]) || 1; }
function habitDailyCount(idx,date){
  const key=`${date.getFullYear()}-${date.getMonth()}`;
  return (DATA.habits.counts && DATA.habits.counts[key] && DATA.habits.counts[key][idx] && DATA.habits.counts[key][idx][date.getDate()]) || 0;
}
function isHabitFrozenOn(idx,date){
  const key=`${date.getFullYear()}-${date.getMonth()}`;
  const arr=(DATA.habits.frozen && DATA.habits.frozen[key] && DATA.habits.frozen[key][idx]) || [];
  return arr.includes(date.getDate());
}
function isHabitDoneOn(idx,date){
  const key=`${date.getFullYear()}-${date.getMonth()}`;
  if(habitType(idx)==='counter') return habitDailyCount(idx,date) >= habitCounterTarget(idx);
  const arr=(DATA.habits.checks[key]&&DATA.habits.checks[key][idx])||[];
  return arr.includes(date.getDate());
}
function habitPct(idx){
  const goal=habitGoal(idx, cur.year, cur.monthIdx);
  const nd=daysInMonth(cur.year,cur.monthIdx);
  let done=0;
  for(let d=1; d<=nd; d++){ if(isHabitDoneOn(idx,new Date(cur.year,cur.monthIdx,d))) done++; }
  return Math.min(1, done/goal);
}
// Frozen days (vacation/sick pause) don't break a streak — they're skipped over —
// but they don't add to the count either.
function habitStreak(idx){
  let d=new Date(); d.setHours(0,0,0,0);
  if(!isHabitDoneOn(idx,d) && !isHabitFrozenOn(idx,d)) d.setDate(d.getDate()-1);
  let streak=0, guard=0;
  while(guard<3660){
    guard++;
    if(isHabitDoneOn(idx,d)){ streak++; d.setDate(d.getDate()-1); continue; }
    if(isHabitFrozenOn(idx,d)){ d.setDate(d.getDate()-1); continue; }
    break;
  }
  return streak;
}

// Cycles a single day's state for a habit on tap:
// - check-type: empty -> done -> frozen -> empty
// - counter-type: 0 -> 1 -> 2 -> ... -> target -> frozen -> 0
function markHabitTime(idx, key, day){
  DATA.habits.times=DATA.habits.times||{};
  DATA.habits.times[key]=DATA.habits.times[key]||{};
  DATA.habits.times[key][idx]=DATA.habits.times[key][idx]||{};
  const d=new Date();
  // only stamp today's cell — back-filling an older day shouldn't claim "now"
  if(day===d.getDate() && key===`${d.getFullYear()}-${d.getMonth()}`) DATA.habits.times[key][idx][day]=nowTime();
}
function habitTimeOn(idx,date){
  const key=`${date.getFullYear()}-${date.getMonth()}`;
  return (DATA.habits.times && DATA.habits.times[key] && DATA.habits.times[key][idx] && DATA.habits.times[key][idx][date.getDate()])||"";
}
function cycleHabitDay(idx, key, day){
  const wasDone=(()=>{ const [y,m]=key.split('-').map(Number); return isHabitDoneOn(idx,new Date(y,m,day)); })();
  DATA.habits.frozen=DATA.habits.frozen||{}; DATA.habits.frozen[key]=DATA.habits.frozen[key]||{}; DATA.habits.frozen[key][idx]=DATA.habits.frozen[key][idx]||[];
  const frozenArr=DATA.habits.frozen[key][idx];
  if(habitType(idx)==='counter'){
    const target=habitCounterTarget(idx);
    DATA.habits.counts=DATA.habits.counts||{}; DATA.habits.counts[key]=DATA.habits.counts[key]||{}; DATA.habits.counts[key][idx]=DATA.habits.counts[key][idx]||{};
    const counts=DATA.habits.counts[key][idx];
    const curC=counts[day]||0;
    const fi=frozenArr.indexOf(day);
    if(fi>=0){ frozenArr.splice(fi,1); delete counts[day]; }
    else if(curC>=target){ frozenArr.push(day); delete counts[day]; }
    else { counts[day]=curC+1; }
  } else {
    DATA.habits.checks[key]=DATA.habits.checks[key]||{}; DATA.habits.checks[key][idx]=DATA.habits.checks[key][idx]||[];
    const doneArr=DATA.habits.checks[key][idx];
    const di=doneArr.indexOf(day), fi=frozenArr.indexOf(day);
    if(di>=0){ doneArr.splice(di,1); frozenArr.push(day); }
    else if(fi>=0){ frozenArr.splice(fi,1); }
    else { doneArr.push(day); }
  }
  const [y,m]=key.split('-').map(Number);
  const nowDone=isHabitDoneOn(idx,new Date(y,m,day));
  if(nowDone && !wasDone) markHabitTime(idx,key,day);
  else if(!nowDone && DATA.habits.times && DATA.habits.times[key] && DATA.habits.times[key][idx])
    delete DATA.habits.times[key][idx][day];
}
function renderArchivedHabits(){
  const ids=DATA.habits.list.map((_,i)=>i).filter(isHabitArchived);
  if(!ids.length) return "";

      <button class="btn ghost" data-unarch="${idx}">Вернуть</button>
      <button class="del" data-del="${idx}">✕</button>

  return `<details class="arch-block">

    ${rows}

}

// ---------- TODOS (one-off tasks with deadline/priority, unlike the daily "Задачи" checklist) ----------
const TODO_PRIORITY_WEIGHT={high:0, medium:1, low:2};
function renderTodos(){
  const list=DATA.todos||[];
  const today=new Date(); today.setHours(0,0,0,0);
  const todayStr=`${today.getFullYear()}-${pad2(today.getMonth()+1)}-${pad2(today.getDate())}`;
  const sorted=list.map((t,i)=>({...t,_i:i})).sort((a,b)=>{
    if(!!a.done!==!!b.done) return a.done?1:-1;
    const pw=(TODO_PRIORITY_WEIGHT[a.priority]??1)-(TODO_PRIORITY_WEIGHT[b.priority]??1);
    if(pw!==0) return pw;
    const ad=a.dueDate||"9999-99-99", bd=b.dueDate||"9999-99-99";
    return ad<bd?-1:ad>bd?1:0;
  });
  const rows=sorted.map(t=>{
    const i=t._i;
    const overdue=t.dueDate && !t.done && t.dueDate<todayStr;
    const dueToday=t.dueDate===todayStr && !t.done;
    return `<div class="todo-row ${t.done?'done':''}">
      <div class="chk ${t.done?'done':''}" data-todoidx="${i}"></div>
      <input class="todo-text" data-toidx="${i}" data-tof="text" value="${escapeHtml(t.text||'')}" placeholder="Что нужно сделать?">
      <input type="date" class="todo-date ${overdue?'overdue':''} ${dueToday?'due-today':''}" data-toidx="${i}" data-tof="dueDate" value="${t.dueDate||''}">
      <select class="todo-priority" data-toidx="${i}" data-tof="priority">
        <option value="high" ${t.priority==="high"?"selected":""}>🔴 Высокий</option>
        <option value="medium" ${(!t.priority||t.priority==="medium")?"selected":""}>🟡 Средний</option>
        <option value="low" ${t.priority==="low"?"selected":""}>⚪ Низкий</option>
      </select>
      <button class="del" data-tododel="${i}">✕</button>
    </div>`;
  }).join("");
  const activeCount=list.filter(t=>!t.done).length;
  const overdueCount=list.filter(t=>!t.done && t.dueDate && t.dueDate<todayStr).length;
  return `<div class="card">
    <h2>Дела</h2>
    <div class="kpi" style="margin-bottom:12px;border-top-color:var(--cyan)">
      <div class="t">Активных дел</div><div class="v">${activeCount}</div>
      ${overdueCount? `<div class="s" style="color:var(--pink);">${overdueCount} просрочено</div>` : ''}
    </div>
    <div class="row-wrap">${rows || '<div class="empty">Дел нет — можно отдохнуть 🙂</div>'}</div>
    <div class="add-row" style="margin-top:10px;">
      <input id="newTodoText" placeholder="Новое дело...">
      <button id="addTodoBtn">+</button>
    </div>
  </div>`;
}

  };

const FINANCE_CATS_DEFAULT=["Еда","Транспорт","Жильё","Развлечения","Здоровье","Другое"];
const CURRENCY_LIST=["RUB","USD","EUR","USDT"];
const CURRENCY_SYMBOL={RUB:"₽",USD:"$",EUR:"€",USDT:"₮"};
function ensureFinanceAccounts(){
  if(!DATA.finance.accounts || !DATA.finance.accounts.length){
    DATA.finance.accounts=[{id:1, name:"Основной", currency:"RUB"}];
  }
  if(!DATA.finance.transfers) DATA.finance.transfers=[];
}
function defaultAccountId(){ return DATA.finance.accounts[0].id; }
function accountBalance(accId){
  let bal=0;
  DATA.finance.entries.forEach(e=>{
    if(String(e.accountId||defaultAccountId())!==String(accId)) return;
    if(e.type==="доход") bal+=(+e.amount||0); else bal-=(+e.amount||0);
  });
  (DATA.finance.transfers||[]).forEach(t=>{
    if(String(t.fromAccountId)===String(accId)) bal-=(+t.amount||0);
    if(String(t.toAccountId)===String(accId)) bal+=(+t.toAmount||+t.amount||0);
  });
  return bal;
}
// RUB accounts are treated as the "primary" spending accounts: budget, category
// breakdown, and the month-end projection only look at them, so a separate
// crypto/foreign-currency account (e.g. USDT income) doesn't skew those numbers.
function rubAccountIds(){ return new Set(DATA.finance.accounts.filter(a=>a.currency==="RUB").map(a=>a.id)); }
function currencyTotals(){
  const totals={};
  const accCurrency={};
  DATA.finance.accounts.forEach(a=>{ accCurrency[a.id]=a.currency; });
  DATA.finance.entries.forEach(e=>{
    const accId=e.accountId||defaultAccountId();
    const curr=accCurrency[accId]||"RUB";
    if(!totals[curr]) totals[curr]={income:0,expense:0};
    if(e.type==="доход") totals[curr].income+=(+e.amount||0); else totals[curr].expense+=(+e.amount||0);
  });
  return totals;
}
function filterFinanceEntries(entries){
  const f=cur.finFilter||{};
  return entries.map((e,i)=>({...e,_i:i})).filter(e=>{
    if(f.type && e.type!==f.type) return false;
    if(f.accountId && String(e.accountId||defaultAccountId())!==String(f.accountId)) return false;
    if(f.category && e.category!==f.category) return false;
    if(f.from && e.date && e.date<f.from) return false;
    if(f.to && e.date && e.date>f.to) return false;
    if(f.q){
      const q=f.q.toLowerCase();
      const hay=`${e.comment||''} ${e.category||''}`.toLowerCase();
      if(!hay.includes(q)) return false;
    }
    return true;
  });
}
function ensureFinanceCats(){
  if(!DATA.financeCats || !DATA.financeCats.length){
    DATA.financeCats = FINANCE_CATS_DEFAULT.map((name,i)=>({name,color:CAT_PALETTE[i%CAT_PALETTE.length]}));
  }
}

// Auto-generates a finance entry for each recurring template (subscription,
// salary, rent, ...) once per month, on/after its configured day-of-month.
// Idempotent: won't duplicate an entry already generated for this month.
function applyRecurring(){
  if(!DATA.finance.recurring || !DATA.finance.recurring.length) return;
  const now=new Date();
  const y=now.getFullYear(), m=now.getMonth();
  const nd=daysInMonth(y,m);
  const todayD=now.getDate();
  const monthPrefix=`${y}-${pad2(m+1)}`;
  const fallbackAccId=(DATA.finance.accounts && DATA.finance.accounts[0] && DATA.finance.accounts[0].id) || 1;
  let changed=false;
  DATA.finance.recurring.forEach(r=>{
    const day=Math.max(1,Math.min(31,+r.day||1,nd));
    if(todayD<day) return;
    const already=DATA.finance.entries.some(e=>e.recurringId===r.id && e.date && e.date.slice(0,7)===monthPrefix);
    if(already) return;
    DATA.finance.entries.push({
      date:`${monthPrefix}-${pad2(day)}`,
      amount:+r.amount||0,
      type:r.type==="доход"?"доход":"расход",
      category:r.category||"",
      comment:r.comment||"",
      accountId:r.accountId||fallbackAccId,
      recurringId:r.id
    });
    changed=true;
  });
  if(changed) scheduleSave();
}

function renderFinance(){
  ensureFinanceCats();
  ensureFinanceAccounts();
  const entries=DATA.finance.entries;
  const totals=currencyTotals();
  const currencies=Object.keys(totals);
  const summaryBoxes=currencies.map(curr=>{
    const t=totals[curr]; const bal=t.income-t.expense; const sym=CURRENCY_SYMBOL[curr]||curr;
    return `<div class="fin-summary">
      <div class="box"><div class="l">Баланс (${curr})</div><div class="v" style="color:${bal>=0?'var(--green)':'var(--pink)'}">${bal.toLocaleString('ru-RU',{maximumFractionDigits:2})} ${sym}</div></div>
      <div class="box"><div class="l">Доход</div><div class="v" style="color:var(--green)">${t.income.toLocaleString('ru-RU',{maximumFractionDigits:2})} ${sym}</div></div>
      <div class="box"><div class="l">Расход</div><div class="v" style="color:var(--pink)">${t.expense.toLocaleString('ru-RU',{maximumFractionDigits:2})} ${sym}</div></div>
    </div>`;
  }).join("");

  const filtered=filterFinanceEntries(entries);
  const rows=filtered.map(e=>{
    const i=e._i;
    const catOptions=DATA.financeCats.map(c=>`<option value="${escapeHtml(c.name)}" ${c.name===e.category?"selected":""}>${escapeHtml(c.name)}</option>`).join("");
    const accOptions=DATA.finance.accounts.map(a=>`<option value="${a.id}" ${String(e.accountId||defaultAccountId())===String(a.id)?"selected":""}>${escapeHtml(a.name)}</option>`).join("");
    return `<div class="fin-entry-wrap">
      <div class="fin-log-row">
        <input type="date" value="${e.date||''}" data-i="${i}" data-f="date">

        </select>
        <select data-i="${i}" data-f="accountId">${accOptions}</select>

        <button class="del" data-delfin="${i}">✕</button>
      </div>
      <input class="fin-comment" value="${escapeHtml(e.comment||'')}" placeholder="Комментарий (необязательно)" data-i="${i}" data-f="comment">
    </div>`;

  const rubIds=rubAccountIds();
  const rubEntries=entries.filter(e=>rubIds.has(e.accountId||defaultAccountId()));
  const catTotals={};
  DATA.financeCats.forEach(c=>catTotals[c.name]=0);
  rubEntries.forEach(e=>{ if(e.type==="расход" && e.category && catTotals[e.category]!=null) catTotals[e.category]+=(+e.amount||0); });
  const maxCat=Math.max(1,...Object.values(catTotals));
  const catBars=DATA.financeCats.map(c=>{
    const v=catTotals[c.name]||0;
    const w=Math.round(v/maxCat*100);
    return `<div style="display:flex;align-items:center;gap:8px;margin-bottom:6px;">
      <div style="width:90px;font-size:11.5px;color:var(--grey);flex:0 0 auto;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${escapeHtml(c.name)}</div>
      <div style="flex:1;background:var(--card);border-radius:6px;height:14px;overflow:hidden;">
        <div style="width:${w}%;height:100%;background:${c.color};border-radius:6px;"></div>
      </div>
      <div style="width:78px;text-align:right;font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--grey);flex:0 0 auto;">${v.toLocaleString('ru-RU')} ₽</div>
    </div>`;
  }).join("");
  const catChips=DATA.financeCats.map((c,i)=>
    `<span class="cat-chip" style="background:${c.color}22;color:${c.color};border:1px solid ${c.color}55;">${escapeHtml(c.name)}<button data-delfincat="${i}">✕</button></span>`).join("");
  const hasRubExpense=rubEntries.some(e=>e.type==="расход");

  const now=new Date();
  const thisMonthPrefix=`${now.getFullYear()}-${pad2(now.getMonth()+1)}`;
  const thisMonthExpense=rubEntries.filter(e=>e.type==="расход" && e.date && e.date.slice(0,7)===thisMonthPrefix)
    .reduce((s,e)=>s+(+e.amount||0),0);
  const budget=+DATA.finance.budgetLimit||0;
  const budgetPct=budget? Math.min(999,Math.round(thisMonthExpense/budget*100)):0;
  const overBudget=budget>0 && thisMonthExpense>budget;
  const daysElapsed=now.getDate();
  const ndThisMonth=daysInMonth(now.getFullYear(),now.getMonth());
  const projectedMonthExpense=daysElapsed>0? Math.round(thisMonthExpense/daysElapsed*ndThisMonth):thisMonthExpense;

  return `<div class="card">
    <h2>Финансы</h2>
    ${summaryBoxes}
    <div style="display:flex;gap:14px;align-items:center;margin:8px 0;">
      <span style="font-size:11px;color:var(--green);font-weight:700;">● Доход</span>
      <span style="font-size:11px;color:var(--pink);font-weight:700;">● Расход</span>
    </div>
    <canvas id="finChart" style="width:100%;height:150px;display:block;margin-bottom:16px;"></canvas>
  </div>

  ${renderAccountsCard()}

  ${renderTransfersCard()}

  <div class="card">
    <h2>Бюджет этого месяца <span style="font-size:11px;color:var(--grey-dim);font-weight:400;">(только рублёвые счета)</span></h2>
    <div class="savings-goal" style="margin-bottom:10px;">
      <div><label>Лимит расходов на месяц, ₽ (0 — не ограничивать)</label><input id="budgetInp" type="number" value="${budget||''}"></div>
    </div>
    ${budget? `<div class="kpi" style="border-top-color:${overBudget?'var(--pink)':'var(--green)'};">
      <div class="t">Потрачено в этом месяце</div><div class="v" style="color:${overBudget?'var(--pink)':'var(--white)'}">${thisMonthExpense.toLocaleString('ru-RU')} ₽</div>
      <div class="s">${overBudget? `Бюджет превышен на ${(thisMonthExpense-budget).toLocaleString('ru-RU')} ₽` : `${budgetPct}% от лимита ${budget.toLocaleString('ru-RU')} ₽`}</div>
      <div class="progress-bar"><div class="fill" style="width:${Math.min(100,budgetPct)}%;background:${overBudget?'var(--pink)':'var(--green)'}"></div></div>
      <div class="s" style="margin-top:6px;">${projectedMonthExpense>budget? `⚠️ При текущем темпе к концу месяца выйдет ~${projectedMonthExpense.toLocaleString('ru-RU')} ₽ — это больше лимита` : `На этом темпе к концу месяца потратишь ~${projectedMonthExpense.toLocaleString('ru-RU')} ₽ — в пределах лимита`}</div>
    </div>` : `<div class="empty">Задай лимит, чтобы отслеживать бюджет</div>`}
  </div>

  ${renderRecurringCard()}

  <div class="card">
    <h2>Расходы по категориям <span style="font-size:11px;color:var(--grey-dim);font-weight:400;">(только рублёвые счета)</span></h2>
    <div>${hasRubExpense? catBars : '<div class="empty">Пока нет расходов с категориями</div>'}</div>
    <div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:12px;">${catChips}</div>
    <div class="add-row" style="margin-top:10px;">
      <input placeholder="Новая категория..." id="newFinCat">
      <button id="addFinCatBtn">+</button>
    </div>
  </div>

  <div class="card">
    <h2>Записи</h2>
    ${renderFinFilterBar()}
    <div id="finRows">${rows || '<div class="empty">Ничего не найдено</div>'}</div>
    <button class="btn" id="addFin" style="margin-top:8px;">+ Добавить запись</button>
  </div>`;
}
function bindFinance(){
  const rubIds=rubAccountIds();
  const entries=DATA.finance.entries.filter(e=>rubIds.has(e.accountId||defaultAccountId()));
  const incByM=Array(12).fill(0), expByM=Array(12).fill(0);
  entries.forEach(e=>{
    if(!e.date) return;
    const dt=parseLocalDate(e.date);
    if(!dt) return;
    const m=dt.getMonth();
    if(e.type==="доход") incByM[m]+=(+e.amount||0); else expByM[m]+=(+e.amount||0);
  });
  drawGroupedBars("finChart", MONTHS_SHORT, [
    {data:incByM, color:cssVar("--green")},
    {data:expByM, color:cssVar("--pink")}
  ]);
  const budgetInp=document.getElementById("budgetInp");
  if(budgetInp) budgetInp.onchange=()=>{ DATA.finance.budgetLimit=budgetInp.value; scheduleSave(); render(); };
  bindRecurringUi();
  bindAccountsUi();
  bindTransfersUi();
  bindFinFilterBar();
  document.querySelectorAll('#finRows input, #finRows select').forEach(el=>{
    el.onchange=()=>{
      const i=+el.dataset.i, f=el.dataset.f;
      DATA.finance.entries[i][f]=el.value; scheduleSave(); render();
    };
  });
  document.querySelectorAll('[data-delfin]').forEach(b=>{
    b.onclick=()=>{ deleteWithUndo('Запись', ()=>DATA.finance.entries.splice(+b.dataset.delfin,1)); };
  });
  document.getElementById("addFin").onclick=()=>{
    DATA.finance.entries.push({date:new Date().toISOString().slice(0,10),time:nowTime(),amount:"",type:"расход",category:"",accountId:defaultAccountId()});
    scheduleSave(); render();
  };
  document.querySelectorAll('[data-delfincat]').forEach(b=>{
    b.onclick=()=>{ const n=(DATA.financeCats[+b.dataset.delfincat]||{}).name||''; deleteWithUndo(`Категория «${n}»`, ()=>DATA.financeCats.splice(+b.dataset.delfincat,1)); };
  });
  const addFinCatBtn=document.getElementById("addFinCatBtn");
  if(addFinCatBtn) addFinCatBtn.onclick=()=>{
    const inp=document.getElementById("newFinCat");
    const v=inp.value.trim();
    if(!v) return;
    if(DATA.financeCats.some(c=>c.name===v)){ flashError(inp,"Такая категория уже есть"); return; }
    DATA.financeCats.push({name:v, color:CAT_PALETTE[DATA.financeCats.length % CAT_PALETTE.length]});
    scheduleSave(); render();
  };
}
function bindAccountsUi(){
  document.querySelectorAll('#accRows [data-ai]').forEach(el=>{
    el.onchange=()=>{
      const i=+el.dataset.ai, f=el.dataset.af;
      DATA.finance.accounts[i][f]=el.value;
      scheduleSave(); render();
    };
  });
  document.querySelectorAll('[data-adel]').forEach(b=>{
    b.onclick=()=>{
      const i=+b.dataset.adel;
      const acc=DATA.finance.accounts[i];
      if(!acc || DATA.finance.accounts.length<2) return;
      deleteWithUndo(`Счёт «${acc.name}»`, ()=>{
        DATA.finance.accounts.splice(i,1);
        const fallbackId=DATA.finance.accounts[0].id;
        DATA.finance.entries.forEach(e=>{ if(String(e.accountId)===String(acc.id)) e.accountId=fallbackId; });
        (DATA.finance.transfers||[]).forEach(t=>{
          if(String(t.fromAccountId)===String(acc.id)) t.fromAccountId=fallbackId;
          if(String(t.toAccountId)===String(acc.id)) t.toAccountId=fallbackId;
        });
      });
    };
  });
  const addBtn=document.getElementById("addAccBtn");
  if(addBtn) addBtn.onclick=()=>{
    const inp=document.getElementById("newAccName");
    const v=inp.value.trim();
    if(!v) return;
    DATA.finance.accounts.push({id:Date.now(), name:v, currency:"RUB"});
    scheduleSave(); render();
  };
}
